<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>pixel editor</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&display=swap');

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

/* ── THEMES ── */
:root[data-theme="dark"] {
  --lcd-bg: #8bac0f;
  --lcd-dark: #0f380f;
  --lcd-mid: #306230;
  --lcd-light: #8bac0f;
  --lcd-off: #9bbc0f;
  --panel: #1a1a1a;
  --panel2: #111;
  --panel3: #0a0a0a;
  --border: #333;
  --text: #8bac0f;
  --text-dim: #4a6a04;
  --accent: #0f380f;
  --pixel-border: #2a2a2a;
  --canvas-bg: #050505;
  --checker1: #1a1a1a;
  --checker2: #111;
  --sel-fill: rgba(139,172,15,0.15);
  --sel-stroke: rgba(139,172,15,0.9);
}

:root[data-theme="light"] {
  --lcd-bg: #3a7a00;
  --lcd-dark: #1a4a00;
  --lcd-mid: #5aa020;
  --lcd-light: #7acc30;
  --lcd-off: #9bbc0f;
  --panel: #e8e8e0;
  --panel2: #f2f0e8;
  --panel3: #dddbd0;
  --border: #b0ae9a;
  --text: #1a3a00;
  --text-dim: #4a6a20;
  --accent: #3a7a00;
  --pixel-border: #c0bea8;
  --canvas-bg: #ccc9b8;
  --checker1: #c0bda8;
  --checker2: #d0cdb8;
  --sel-fill: rgba(58,122,0,0.12);
  --sel-stroke: rgba(58,122,0,0.9);
}

body {
  background: var(--panel3);
  color: var(--text);
  font-family: 'Share Tech Mono', monospace;
  height: 100vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  user-select: none;
  touch-action: none;
}

/* ── HEADER ── */
#header {
  background: var(--panel2);
  border-bottom: 2px solid var(--lcd-mid);
  padding: 5px 10px;
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
  flex-wrap: wrap;
}
#logo {
  font-family: 'VT323', monospace;
  font-size: 24px;
  color: var(--lcd-bg);
  letter-spacing: 3px;
  text-shadow: 0 0 8px rgba(139,172,15,0.3);
}
#logo span { color: var(--lcd-mid); }
.hdr-info { font-size: 10px; color: var(--text-dim); }
.size-ctrl { display: flex; align-items: center; gap: 4px; }
.size-ctrl input {
  background: var(--panel3);
  border: 1px solid var(--lcd-mid);
  color: var(--text);
  font-family: 'Share Tech Mono', monospace;
  font-size: 11px;
  width: 34px;
  text-align: center;
  padding: 2px;
}
.size-ctrl input:focus { outline: 1px solid var(--lcd-bg); }
.hdr-btn {
  background: var(--panel3);
  border: 1px solid var(--lcd-mid);
  color: var(--text);
  font-family: 'Share Tech Mono', monospace;
  font-size: 10px;
  padding: 3px 6px;
  cursor: pointer;
  letter-spacing: 1px;
}
.hdr-btn:hover { background: var(--lcd-mid); color: #fff; }
.spacer { flex: 1; }

/* theme toggle */
#theme-btn {
  background: var(--panel3);
  border: 1px solid var(--lcd-mid);
  color: var(--text);
  font-family: 'VT323', monospace;
  font-size: 18px;
  padding: 1px 8px;
  cursor: pointer;
  line-height: 1.4;
}
#theme-btn:hover { background: var(--lcd-mid); }

/* ── MAIN LAYOUT ── */
#main {
  display: flex;
  flex: 1;
  overflow: hidden;
  min-height: 0;
}

/* ── LEFT PANEL ── */
#left-panel {
  width: 120px;
  background: var(--panel2);
  border-right: 2px solid var(--border);
  display: flex;
  flex-direction: column;
  gap: 0;
  flex-shrink: 0;
  overflow-y: auto;
}

.panel-section {
  border-bottom: 1px solid var(--border);
  padding: 7px;
}
.panel-label {
  font-size: 9px;
  color: var(--text-dim);
  letter-spacing: 2px;
  margin-bottom: 5px;
}

/* tools */
#tool-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 2px;
}
.tool-btn {
  background: var(--panel3);
  border: 1px solid var(--border);
  color: var(--text-dim);
  font-family: 'VT323', monospace;
  font-size: 16px;
  padding: 4px 2px;
  cursor: pointer;
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1px;
  transition: all 0.1s;
  line-height: 1;
}
.tool-btn .tname {
  font-family: 'Share Tech Mono', monospace;
  font-size: 7px;
  letter-spacing: 0;
}
.tool-btn:hover { border-color: var(--lcd-mid); color: var(--text); }
.tool-btn.active {
  background: var(--lcd-mid);
  color: #fff;
  border-color: var(--lcd-bg);
}

/* color swatches */
#fg-bg-display {
  position: relative;
  width: 54px;
  height: 40px;
  margin: 0 auto 4px;
}
.color-swatch {
  width: 32px;
  height: 28px;
  border: 2px solid var(--lcd-bg);
  cursor: pointer;
  position: absolute;
}
#bg-swatch { bottom: 0; right: 0; border-color: var(--lcd-mid); z-index: 1; }
#fg-swatch { top: 0; left: 0; z-index: 2; }

#swap-btn {
  position: absolute; top: 0; right: 0;
  background: none; border: none; color: var(--text-dim);
  font-size: 11px; cursor: pointer; z-index: 3;
  padding: 0; line-height: 1;
}
#swap-btn:hover { color: var(--text); }

/* palette grid */
#palette-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 2px;
  margin-bottom: 5px;
}
.pal-cell {
  width: 100%;
  aspect-ratio: 1;
  border: 1px solid var(--border);
  cursor: pointer;
  position: relative;
}
.pal-cell:hover { border-color: var(--lcd-bg); outline: 1px solid var(--lcd-bg); }
.pal-cell.selected-fg::after {
  content: 'F';
  position: absolute; top: 0; left: 1px;
  font-size: 7px; color: #fff; line-height: 1;
  text-shadow: 0 0 2px #000;
  font-family: 'Share Tech Mono', monospace;
  font-weight: bold;
}
.pal-cell.selected-bg::after {
  content: 'B';
  position: absolute; bottom: 0; right: 1px;
  font-size: 7px; color: #000; line-height: 1;
  text-shadow: 0 0 2px #fff;
  font-family: 'Share Tech Mono', monospace;
  font-weight: bold;
}

/* transparent/eraser cell pattern */
.pal-cell.eraser-cell {
  background: repeating-conic-gradient(#ccc 0% 25%, #fff 0% 50%) 0 0 / 8px 8px !important;
}

.pal-preset-row {
  display: flex; gap: 3px; margin-bottom: 4px;
}
.pal-preset-btn {
  flex: 1; font-size: 8px; padding: 2px 0;
  background: var(--panel3); border: 1px solid var(--border);
  color: var(--text-dim); cursor: pointer; font-family: 'Share Tech Mono', monospace;
}
.pal-preset-btn:hover { border-color: var(--lcd-mid); color: var(--text); }
.pal-preset-btn.active-preset { border-color: var(--lcd-bg); color: var(--text); background: var(--lcd-dark); }

/* FULL palette edit hint */
#full-edit-hint {
  font-size: 8px;
  color: var(--text-dim);
  text-align: center;
  margin-top: 2px;
  display: none;
}

/* brush */
.slider-row { display: flex; align-items: center; gap: 4px; margin-bottom: 4px; }
.slider-row label { font-size: 9px; color: var(--text-dim); white-space: nowrap; }
.slider-row input[type=range] {
  flex: 1; accent-color: var(--lcd-bg); height: 2px;
}
.slider-row span { font-size: 9px; min-width: 18px; text-align: right; }

/* ── CENTER ── */
#center {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: var(--canvas-bg);
  overflow: hidden;
  position: relative;
  min-width: 0;
}

#canvas-wrapper {
  position: relative;
  cursor: crosshair;
  image-rendering: pixelated;
}

#main-canvas {
  display: block;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
}

#grid-canvas, #onion-canvas, #select-canvas {
  position: absolute;
  top: 0; left: 0;
  pointer-events: none;
  image-rendering: pixelated;
}

#onion-canvas { opacity: 0.3; }

#select-canvas { z-index: 5; }

/* zoom controls */
#zoom-bar {
  position: absolute;
  bottom: 10px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 6px;
  background: rgba(0,0,0,0.75);
  border: 1px solid var(--border);
  padding: 3px 8px;
  font-size: 10px;
}
.zoom-btn {
  background: none; border: none; color: var(--text);
  font-size: 16px; cursor: pointer; font-family: 'VT323', monospace;
  padding: 0 2px; line-height: 1;
}
.zoom-btn:hover { color: var(--lcd-bg); }
#zoom-label { min-width: 32px; text-align: center; font-size: 10px; }

#coord-label {
  position: absolute;
  top: 6px; left: 6px;
  font-size: 10px;
  color: var(--text-dim);
  background: rgba(0,0,0,0.65);
  padding: 2px 6px;
  pointer-events: none;
}

/* ── RIGHT PANEL ── */
#right-panel {
  width: 148px;
  background: var(--panel2);
  border-left: 2px solid var(--border);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  overflow-y: auto;
}

#preview-wrap {
  background: var(--panel3);
  border: 1px solid var(--lcd-mid);
  width: 100%;
  aspect-ratio: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 5px;
  overflow: hidden;
  position: relative;
}
#preview-canvas {
  image-rendering: pixelated;
  image-rendering: crisp-edges;
}
.preview-controls {
  display: flex; gap: 4px; align-items: center; flex-wrap: wrap;
}
.preview-controls label { font-size: 9px; color: var(--text-dim); }
.preview-controls input[type=number] {
  width: 30px; background: var(--panel3); border: 1px solid var(--border);
  color: var(--text); font-family: 'Share Tech Mono', monospace;
  font-size: 10px; text-align: center; padding: 1px;
}
#play-btn {
  background: var(--panel3); border: 1px solid var(--lcd-mid); color: var(--text);
  font-family: 'VT323', monospace; font-size: 16px;
  padding: 1px 5px; cursor: pointer; margin-left: auto;
}
#play-btn:hover, #play-btn.playing { background: var(--lcd-mid); color: #fff; }
#onion-toggle {
  font-size: 8px; color: var(--text-dim);
  background: var(--panel3); border: 1px solid var(--border);
  cursor: pointer; padding: 1px 4px; font-family: 'Share Tech Mono', monospace;
}
#onion-toggle.on { border-color: var(--lcd-mid); color: var(--text); }

/* frames */
#frames-section {
  flex: 1;
  overflow-y: auto;
  padding: 7px;
  border-bottom: 1px solid var(--border);
}
#frames-list {
  display: flex;
  flex-direction: column;
  gap: 3px;
}
.frame-item {
  display: flex;
  align-items: center;
  gap: 3px;
  padding: 2px;
  border: 1px solid var(--border);
  cursor: pointer;
  background: var(--panel3);
  transition: border-color 0.1s;
}
.frame-item:hover { border-color: var(--lcd-mid); }
.frame-item.active { border-color: var(--lcd-bg); }
.frame-thumb {
  width: 32px; height: 32px;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
  flex-shrink: 0;
  border: 1px solid var(--border);
}
.frame-num { font-size: 8px; color: var(--text-dim); flex: 1; }
.frame-del {
  font-size: 10px; color: var(--text-dim); cursor: pointer;
  background: none; border: none; padding: 0 2px;
  font-family: 'Share Tech Mono', monospace;
}
.frame-del:hover { color: #f44; }

#frame-btns {
  display: flex; gap: 3px; margin-top: 5px;
}
.frame-btn {
  flex: 1; font-size: 8px; padding: 2px 0;
  background: var(--panel3); border: 1px solid var(--border);
  color: var(--text-dim); cursor: pointer;
  font-family: 'Share Tech Mono', monospace;
}
.frame-btn:hover { border-color: var(--lcd-mid); color: var(--text); }

/* export section */
#export-section {
  padding: 7px;
  border-bottom: 1px solid var(--border);
}
.exp-row { display: flex; gap: 3px; margin-bottom: 4px; align-items: center; }
.exp-label { font-size: 9px; color: var(--text-dim); white-space: nowrap; }
.exp-select {
  flex: 1; background: var(--panel3); border: 1px solid var(--border);
  color: var(--text); font-family: 'Share Tech Mono', monospace;
  font-size: 9px; padding: 1px;
}
.exp-btn {
  width: 100%; font-size: 9px; padding: 3px;
  background: var(--panel3); border: 1px solid var(--lcd-mid);
  color: var(--text); cursor: pointer;
  font-family: 'Share Tech Mono', monospace;
  margin-bottom: 3px; letter-spacing: 1px;
}
.exp-btn:hover { background: var(--lcd-mid); color: #fff; }

/* save/load */
#saveload-section {
  padding: 7px;
}
.sl-btn {
  width: 100%; font-size: 8px; padding: 3px;
  background: var(--panel3); border: 1px solid var(--border);
  color: var(--text-dim); cursor: pointer;
  font-family: 'Share Tech Mono', monospace;
  margin-bottom: 3px; letter-spacing: 1px;
}
.sl-btn:hover { border-color: var(--lcd-mid); color: var(--text); }

/* toast */
#toast {
  position: fixed; bottom: 40px; left: 50%;
  transform: translateX(-50%);
  background: var(--lcd-dark);
  border: 1px solid var(--lcd-bg);
  color: var(--lcd-bg);
  font-family: 'Share Tech Mono', monospace;
  font-size: 11px;
  padding: 5px 12px;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.2s;
  z-index: 999;
  white-space: nowrap;
}
#toast.show { opacity: 1; }

/* tool indicator */
#tool-indicator {
  position: absolute;
  top: 6px; right: 6px;
  font-family: 'VT323', monospace;
  font-size: 18px;
  color: var(--text-dim);
  background: rgba(0,0,0,0.65);
  padding: 2px 7px;
  pointer-events: none;
}

/* selection overlay */
.selection-info {
  position: absolute;
  bottom: 36px; left: 50%;
  transform: translateX(-50%);
  background: rgba(0,0,0,0.75);
  border: 1px solid var(--lcd-mid);
  color: var(--text);
  font-size: 9px;
  padding: 2px 8px;
  pointer-events: none;
  display: none;
  white-space: nowrap;
}

/* color picker popup */
#color-picker-popup {
  position: fixed;
  background: var(--panel2);
  border: 2px solid var(--lcd-mid);
  padding: 10px;
  z-index: 200;
  display: none;
  flex-direction: column;
  gap: 6px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.4);
}
#color-picker-popup.show { display: flex; }
#color-picker-popup input[type=color] {
  width: 80px; height: 30px; border: none; background: none; cursor: pointer;
}
#color-picker-popup input[type=text] {
  width: 80px; background: var(--panel3); border: 1px solid var(--lcd-mid);
  color: var(--text); font-family: 'Share Tech Mono', monospace;
  font-size: 11px; padding: 2px 4px;
}
#color-picker-popup button {
  font-size: 10px; padding: 3px;
  background: var(--lcd-mid); border: none; color: #fff;
  cursor: pointer; font-family: 'Share Tech Mono', monospace;
}

/* scrollbar */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: var(--panel3); }
::-webkit-scrollbar-thumb { background: var(--border); }
::-webkit-scrollbar-thumb:hover { background: var(--lcd-mid); }

/* ── MOBILE overlay toolbar ── */
#mobile-toolbar {
  display: none;
  position: fixed;
  bottom: 0; left: 0; right: 0;
  background: var(--panel2);
  border-top: 2px solid var(--lcd-mid);
  padding: 4px 6px;
  z-index: 100;
  justify-content: space-around;
  align-items: center;
  gap: 4px;
  flex-wrap: wrap;
}
.mob-btn {
  background: var(--panel3);
  border: 1px solid var(--border);
  color: var(--text);
  font-family: 'VT323', monospace;
  font-size: 20px;
  padding: 4px 8px;
  cursor: pointer;
  line-height: 1;
  min-width: 40px;
  text-align: center;
}
.mob-btn.active { background: var(--lcd-mid); color: #fff; border-color: var(--lcd-bg); }
.mob-btn:active { opacity: 0.7; }

/* side panels collapse on small screens */
@media (max-width: 600px) {
  #left-panel { width: 88px; }
  #right-panel { display: none; }
  #mobile-toolbar { display: flex; }
  body { padding-bottom: 52px; }
  #header { gap: 6px; padding: 4px 6px; }
  #logo { font-size: 20px; }
}

@media (max-width: 400px) {
  #left-panel { display: none; }
  #mobile-toolbar { display: flex; }
}
</style>
</head>
<body>

<!-- HEADER -->
<div id="header">
  <div id="logo">PIXEL<span>-</span>PAINT</div>
  <div class="hdr-info">SIZE: <span id="canvas-size-label">32×32</span></div>
  <div class="size-ctrl">
    <input type="number" id="new-w" value="32" min="1" max="128" title="width">
    <span style="color:var(--text-dim)">×</span>
    <input type="number" id="new-h" value="32" min="1" max="128" title="height">
    <button class="hdr-btn" id="resize-btn">RESIZE</button>
  </div>
  <div class="spacer"></div>
  <div class="hdr-info" style="font-size:9px">Ctrl+Z:UNDO Ctrl+Y:REDO</div>
  <button id="theme-btn" title="Toggle Light/Dark">☀</button>
</div>

<!-- MAIN -->
<div id="main">

  <!-- LEFT PANEL -->
  <div id="left-panel">
    <div class="panel-section">
      <div class="panel-label">// TOOLS</div>
      <div id="tool-grid">
        <button class="tool-btn active" data-tool="pen">✏<span class="tname">PEN</span></button>
        <button class="tool-btn" data-tool="eraser">⬜<span class="tname">ERASE</span></button>
        <button class="tool-btn" data-tool="fill">🪣<span class="tname">FILL</span></button>
        <button class="tool-btn" data-tool="eyedrop">💧<span class="tname">DROP</span></button>
        <button class="tool-btn" data-tool="select">⬚<span class="tname">SEL</span></button>
        <button class="tool-btn" data-tool="move">✥<span class="tname">MOVE</span></button>
      </div>
    </div>

    <div class="panel-section">
      <div class="panel-label">// COLOR</div>
      <div id="fg-bg-display">
        <div class="color-swatch" id="bg-swatch" title="Background (right-click)"></div>
        <div class="color-swatch" id="fg-swatch" title="Foreground (left-click)"></div>
        <button id="swap-btn" title="Swap FG/BG">⇄</button>
      </div>
      <div style="font-size:8px;color:var(--text-dim);text-align:center;margin-bottom:4px;">
        L:FG / R:BG<br>Ctrl+Click:DROP
      </div>
    </div>

    <div class="panel-section">
      <div class="panel-label">// PALETTE</div>
      <div id="palette-grid"></div>
      <div class="pal-preset-row">
        <button class="pal-preset-btn active-preset" data-preset="digi">DIGI</button>
        <button class="pal-preset-btn" data-preset="full">FULL</button>
      </div>
      <div id="full-edit-hint">▲ dbl-click to edit</div>
    </div>

    <!-- Selection clipboard buttons -->
    <div class="panel-section" id="sel-section">
      <div class="panel-label">// CLIPBOARD</div>
      <div style="display:flex;flex-direction:column;gap:2px;">
        <button class="frame-btn" id="sel-copy-btn">COPY</button>
        <button class="frame-btn" id="sel-cut-btn">CUT</button>
        <button class="frame-btn" id="sel-paste-btn">PASTE</button>
        <button class="frame-btn" id="sel-clear-btn">DESEL</button>
      </div>
    </div>

    <div class="panel-section">
      <div class="panel-label">// BRUSH</div>
      <div class="slider-row">
        <label>SZ</label>
        <input type="range" id="brush-size" min="1" max="8" value="1">
        <span id="brush-size-val">1</span>
      </div>
    </div>

    <div class="panel-section">
      <div class="panel-label">// EDIT</div>
      <div style="display:flex;flex-direction:column;gap:2px;">
        <button class="frame-btn" id="flip-h-btn">FLIP H</button>
        <button class="frame-btn" id="flip-v-btn">FLIP V</button>
        <button class="frame-btn" id="clear-btn">CLEAR</button>
      </div>
      <div style="margin-top:4px;">
        <button class="frame-btn" id="grid-toggle">GRID: ON</button>
      </div>
    </div>
  </div>

  <!-- CENTER CANVAS -->
  <div id="center">
    <div id="canvas-wrapper">
      <canvas id="onion-canvas"></canvas>
      <canvas id="main-canvas"></canvas>
      <canvas id="grid-canvas"></canvas>
      <canvas id="select-canvas"></canvas>
    </div>
    <div id="coord-label">0, 0</div>
    <div id="tool-indicator">PEN</div>
    <div id="selection-info" class="selection-info"></div>
    <div id="zoom-bar">
      <button class="zoom-btn" id="zoom-out">－</button>
      <span id="zoom-label">8×</span>
      <button class="zoom-btn" id="zoom-in">＋</button>
    </div>
  </div>

  <!-- RIGHT PANEL -->
  <div id="right-panel">
    <div class="panel-section" id="preview-section">
      <div class="panel-label">// PREVIEW</div>

<div id="mobile-toolbar">
  <button class="mob-btn active" data-tool="pen" title="Pen">✏</button>
  <button class="mob-btn" data-tool="eraser" title="Eraser">⬜</button>

<!-- Color picker popup -->
<div id="color-picker-popup">
  <div style="font-size:10px;color:var(--text-dim)" id="picker-title">FG COLOR</div>
  <input type="color" id="native-picker">
  <input type="text" id="hex-input" placeholder="#8bac0f" maxlength="7">
  <button id="picker-ok-btn">OK</button>
</div>

<!-- Toast -->
<div id="toast"></div>

<script>
// ── STATE ──────────────────────────────────────────────────────────────────
let W = 32, H = 32;
let zoom = 8;
let tool = 'pen';
let fgColor = '#0f380f';
let bgColor = '#8bac0f';
let brushSize = 1;
let showGrid = true;
let onionSkin = false;
let isPlaying = false;
let playInterval = null;
let fps = 4;
let currentFrame = 0;
let editingColorFor = 'fg';
let currentPaletteMode = 'digi'; // 'digi' | 'full'

// frames: array of Uint8ClampedArray (RGBA)
let frames = [];
let undoStack = [];
let redoStack = [];
const MAX_UNDO = 32;

// Selection state
let selection = null; // { x, y, w, h }
let selDragging = false;
let selStart = null;
let clipboard = null; // Uint8ClampedArray + { w, h }
let pasteActive = false;
let pasteOffset = { x: 0, y: 0 };
let pasteBuf = null; // { data, w, h }
let moveDragging = false;
let moveStart = null;
let moveFrame = null; // saved frame before move

// Palette
const ERASER_COLOR = 'transparent';
let palette = [];

const DIGI_PALETTE = [
  ERASER_COLOR,
  '#0f380f','#306230','#8bac0f','#9bbc0f',
  '#ffffff','#000000','#1a1a1a','#2a2a2a',
  '#3a3a3a','#5a5a5a','#7a7a7a','#9a9a9a',
  '#bbbbbb','#dddddd','#c0d04f'
];

const FULL_PALETTE = [
  ERASER_COLOR,
  '#ff0000','#ff4400','#ff8800','#ffcc00',
  '#ffff00','#aaff00','#00ff00','#00ff88',
  '#00ffff','#0088ff','#0000ff','#8800ff',
  '#ff00ff','#ffffff','#000000'
];

let selectedFgIdx = 1;
let selectedBgIdx = 4;

// ── DOM REFS ──────────────────────────────────────────────────────────────
const mainCanvas   = document.getElementById('main-canvas');
const gridCanvas   = document.getElementById('grid-canvas');
const onionCanvas  = document.getElementById('onion-canvas');
const selectCanvas = document.getElementById('select-canvas');
const previewCanvas= document.getElementById('preview-canvas');
const canvasWrapper= document.getElementById('canvas-wrapper');
const coordLabel   = document.getElementById('coord-label');
const toolIndicator= document.getElementById('tool-indicator');
const zoomLabel    = document.getElementById('zoom-label');
const fgSwatch     = document.getElementById('fg-swatch');
const bgSwatch     = document.getElementById('bg-swatch');
const paletteGrid  = document.getElementById('palette-grid');
const framesList   = document.getElementById('frames-list');
const toastEl      = document.getElementById('toast');
const colorPopup   = document.getElementById('color-picker-popup');
const nativePicker = document.getElementById('native-picker');
const hexInput     = document.getElementById('hex-input');
const selInfo      = document.getElementById('selection-info');
const fullEditHint = document.getElementById('full-edit-hint');

const ctx  = mainCanvas.getContext('2d');
const gCtx = gridCanvas.getContext('2d');
const oCtx = onionCanvas.getContext('2d');
const sCtx = selectCanvas.getContext('2d');
const pCtx = previewCanvas.getContext('2d');

// ── THEME ─────────────────────────────────────────────────────────────────
let currentTheme = 'dark';
document.documentElement.setAttribute('data-theme', 'dark');
document.getElementById('theme-btn').onclick = () => {
  currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', currentTheme);
  document.getElementById('theme-btn').textContent = currentTheme === 'dark' ? '☀' : '🌙';
  renderAll();
  toast(currentTheme.toUpperCase() + ' MODE');
};

// ── INIT ──────────────────────────────────────────────────────────────────
function initEditor() {
  palette = [...DIGI_PALETTE];
  frames = [newFrame()];
  undoStack = [[]];
  redoStack = [[]];
  applyZoom();
  renderAll();
  renderFramesList();
  renderPalette();
  updateSwatches();
  fgColor = palette[selectedFgIdx] === ERASER_COLOR ? 'transparent' : palette[selectedFgIdx];
  bgColor = palette[selectedBgIdx] === ERASER_COLOR ? 'transparent' : palette[selectedBgIdx];
  updateSwatches();
}

function newFrame() {
  return new Uint8ClampedArray(W * H * 4);
}

function applyZoom() {
  const pw = W * zoom;
  const ph = H * zoom;
  [mainCanvas, gridCanvas, onionCanvas, selectCanvas].forEach(c => {
    c.width = pw; c.height = ph;
  });
  canvasWrapper.style.width = pw + 'px';
  canvasWrapper.style.height = ph + 'px';
  zoomLabel.textContent = zoom + '×';
  const maxP = 128;
  const pScale = Math.min(Math.floor(maxP / Math.max(W, H)), 8);
  previewCanvas.width = W * pScale;
  previewCanvas.height = H * pScale;
  previewCanvas.style.width = W * pScale + 'px';
  previewCanvas.style.height = H * pScale + 'px';
  document.getElementById('canvas-size-label').textContent = W + '×' + H;
}

// ── RENDER ────────────────────────────────────────────────────────────────
function renderAll() {
  renderMain();
  renderGrid();
  renderOnion();
  renderPreview();
  renderSelection();
}

function getCheckerColors() {
  return currentTheme === 'light'
    ? ['#c0bda8','#d0cdb8']
    : ['#1a1a1a','#111'];
}

function drawCheckerboard(c, w, h) {
  const [c1, c2] = getCheckerColors();
  const sz = 8;
  for (let y = 0; y < h; y += sz) {
    for (let x = 0; x < w; x += sz) {
      c.fillStyle = ((x / sz + y / sz) % 2 === 0) ? c1 : c2;
      c.fillRect(x, y, sz, sz);
    }
  }
}

function renderMain() {
  const data = frames[currentFrame];
  const img = new ImageData(new Uint8ClampedArray(data), W, H);
  const offscreen = document.createElement('canvas');
  offscreen.width = W; offscreen.height = H;
  offscreen.getContext('2d').putImageData(img, 0, 0);
  ctx.clearRect(0, 0, W * zoom, H * zoom);
  drawCheckerboard(ctx, W * zoom, H * zoom);
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(offscreen, 0, 0, W * zoom, H * zoom);

  // draw paste preview
  if (pasteActive && pasteBuf) {
    const off2 = document.createElement('canvas');
    off2.width = pasteBuf.w; off2.height = pasteBuf.h;
    off2.getContext('2d').putImageData(new ImageData(new Uint8ClampedArray(pasteBuf.data), pasteBuf.w, pasteBuf.h), 0, 0);
    ctx.globalAlpha = 0.85;
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(off2, pasteOffset.x * zoom, pasteOffset.y * zoom, pasteBuf.w * zoom, pasteBuf.h * zoom);
    ctx.globalAlpha = 1;
  }
}

function renderGrid() {
  gCtx.clearRect(0, 0, W * zoom, H * zoom);
  if (!showGrid || zoom < 4) return;
  gCtx.strokeStyle = currentTheme === 'light'
    ? 'rgba(58,122,0,0.18)'
    : 'rgba(139,172,15,0.2)';
  gCtx.lineWidth = 0.5;
  for (let x = 0; x <= W; x++) {
    gCtx.beginPath();
    gCtx.moveTo(x * zoom, 0);
    gCtx.lineTo(x * zoom, H * zoom);
    gCtx.stroke();
  }
  for (let y = 0; y <= H; y++) {
    gCtx.beginPath();
    gCtx.moveTo(0, y * zoom);
    gCtx.lineTo(W * zoom, y * zoom);
    gCtx.stroke();
  }
}

function renderOnion() {
  oCtx.clearRect(0, 0, W * zoom, H * zoom);
  if (!onionSkin || currentFrame === 0) return;
  const prevData = frames[currentFrame - 1];
  const img = new ImageData(new Uint8ClampedArray(prevData), W, H);
  const off = document.createElement('canvas');
  off.width = W; off.height = H;
  off.getContext('2d').putImageData(img, 0, 0);
  oCtx.imageSmoothingEnabled = false;
  oCtx.drawImage(off, 0, 0, W * zoom, H * zoom);
}

function renderPreview(frameIdx) {
  const fi = frameIdx !== undefined ? frameIdx : currentFrame;
  const data = frames[fi];
  const img = new ImageData(new Uint8ClampedArray(data), W, H);
  const off = document.createElement('canvas');
  off.width = W; off.height = H;
  off.getContext('2d').putImageData(img, 0, 0);
  const pw = previewCanvas.width;
  const ph = previewCanvas.height;
  pCtx.clearRect(0, 0, pw, ph);
  drawCheckerboard(pCtx, pw, ph);
  pCtx.imageSmoothingEnabled = false;
  pCtx.drawImage(off, 0, 0, pw, ph);
}

// ── SELECTION RENDER ──────────────────────────────────────────────────────
function renderSelection() {
  sCtx.clearRect(0, 0, W * zoom, H * zoom);
  const sel = pasteActive && pasteBuf
    ? { x: pasteOffset.x, y: pasteOffset.y, w: pasteBuf.w, h: pasteBuf.h }
    : selection;
  if (!sel) {
    selInfo.style.display = 'none';
    return;
  }
  const sx = sel.x * zoom, sy = sel.y * zoom;
  const sw = sel.w * zoom, sh = sel.h * zoom;

  sCtx.fillStyle = 'rgba(139,172,15,0.12)';
  if (currentTheme === 'light') sCtx.fillStyle = 'rgba(58,122,0,0.10)';
  sCtx.fillRect(sx, sy, sw, sh);

  // animated dash
  sCtx.save();
  sCtx.strokeStyle = currentTheme === 'light' ? '#3a7a00' : '#8bac0f';
  sCtx.lineWidth = 1.5;
  const t = Date.now() / 150;
  sCtx.setLineDash([4, 3]);
  sCtx.lineDashOffset = -t;
  sCtx.strokeRect(sx + 0.5, sy + 0.5, sw - 1, sh - 1);
  sCtx.restore();

  if (pasteActive) {
    selInfo.textContent = `PASTE ${pasteBuf.w}×${pasteBuf.h} → [${pasteOffset.x},${pasteOffset.y}] (Enter:commit Esc:cancel)`;
  } else {
    selInfo.textContent = `SEL ${sel.w}×${sel.h} @ [${sel.x},${sel.y}]`;
  }
  selInfo.style.display = 'block';
}

// Start animated selection loop
(function selLoop() {
  if (selection || (pasteActive && pasteBuf)) renderSelection();
  requestAnimationFrame(selLoop);
})();

// ── FRAME MANAGEMENT ─────────────────────────────────────────────────────
function renderFramesList() {
  framesList.innerHTML = '';
  frames.forEach((frame, i) => {
    const item = document.createElement('div');
    item.className = 'frame-item' + (i === currentFrame ? ' active' : '');
    item.dataset.index = i;

    const thumb = document.createElement('canvas');
    thumb.className = 'frame-thumb';
    thumb.width = W; thumb.height = H;
    const tCtx = thumb.getContext('2d');
    const img = new ImageData(new Uint8ClampedArray(frame), W, H);
    tCtx.putImageData(img, 0, 0);

    const num = document.createElement('div');
    num.className = 'frame-num';
    num.textContent = '#' + (i + 1);

    const del = document.createElement('button');
    del.className = 'frame-del';
    del.textContent = '×';
    del.title = 'Delete frame';
    del.onclick = (e) => { e.stopPropagation(); deleteFrame(i); };

    item.append(thumb, num, del);
    item.onclick = () => switchFrame(i);
    framesList.appendChild(item);
  });
}

function switchFrame(i) {
  currentFrame = i;
  selection = null;
  pasteActive = false;
  renderAll();
  renderFramesList();
}

function addFrame() {
  frames.push(newFrame());
  undoStack.push([]);
  redoStack.push([]);
  switchFrame(frames.length - 1);
}

function dupFrame() {
  const copy = new Uint8ClampedArray(frames[currentFrame]);
  frames.splice(currentFrame + 1, 0, copy);
  undoStack.splice(currentFrame + 1, 0, []);
  redoStack.splice(currentFrame + 1, 0, []);
  switchFrame(currentFrame + 1);
}

function deleteFrame(i) {
  if (frames.length === 1) { toast('Cannot delete last frame'); return; }
  frames.splice(i, 1);
  undoStack.splice(i, 1);
  redoStack.splice(i, 1);
  if (currentFrame >= frames.length) currentFrame = frames.length - 1;
  switchFrame(currentFrame);
}

// ── DRAWING ───────────────────────────────────────────────────────────────
function hexToRgba(hex) {
  if (hex === ERASER_COLOR || hex === 'transparent') return [0, 0, 0, 0];
  const r = parseInt(hex.slice(1,3), 16);
  const g = parseInt(hex.slice(3,5), 16);
  const b = parseInt(hex.slice(5,7), 16);
  return [r, g, b, 255];
}

function setPixel(frameData, x, y, rgba) {
  if (x < 0 || x >= W || y < 0 || y >= H) return;
  const idx = (y * W + x) * 4;
  frameData[idx] = rgba[0];
  frameData[idx+1] = rgba[1];
  frameData[idx+2] = rgba[2];
  frameData[idx+3] = rgba[3];
}

function getPixel(frameData, x, y) {
  if (x < 0 || x >= W || y < 0 || y >= H) return [0,0,0,0];
  const idx = (y * W + x) * 4;
  return [frameData[idx], frameData[idx+1], frameData[idx+2], frameData[idx+3]];
}

function rgbaEqual(a, b) {
  return a[0]===b[0] && a[1]===b[1] && a[2]===b[2] && a[3]===b[3];
}

let painting = false;
let paintColor = null;

function pushUndo() {
  undoStack[currentFrame].push(new Uint8ClampedArray(frames[currentFrame]));
  if (undoStack[currentFrame].length > MAX_UNDO) undoStack[currentFrame].shift();
  redoStack[currentFrame] = [];
}

function undo() {
  if (!undoStack[currentFrame].length) return;
  redoStack[currentFrame].push(new Uint8ClampedArray(frames[currentFrame]));
  frames[currentFrame] = undoStack[currentFrame].pop();
  renderAll(); renderFramesList();
  toast('UNDO');
}

function redo() {
  if (!redoStack[currentFrame].length) return;
  undoStack[currentFrame].push(new Uint8ClampedArray(frames[currentFrame]));
  frames[currentFrame] = redoStack[currentFrame].pop();
  renderAll(); renderFramesList();
  toast('REDO');
}

function getCanvasXY(clientX, clientY) {
  const rect = mainCanvas.getBoundingClientRect();
  const cx = Math.floor((clientX - rect.left) / zoom);
  const cy = Math.floor((clientY - rect.top) / zoom);
  return [cx, cy];
}

function paintAt(x, y, color) {
  const rgba = (color === 'erase' || color === 'transparent' || color === ERASER_COLOR) ? [0,0,0,0] : hexToRgba(color);
  const half = Math.floor(brushSize / 2);
  for (let dy = -half; dy < brushSize - half; dy++) {
    for (let dx = -half; dx < brushSize - half; dx++) {
      setPixel(frames[currentFrame], x + dx, y + dy, rgba);
    }
  }
}

function floodFill(x, y, fillColor) {
  if (x < 0 || x >= W || y < 0 || y >= H) return;
  const target = getPixel(frames[currentFrame], x, y);
  const fill = (fillColor === 'erase' || fillColor === 'transparent') ? [0,0,0,0] : hexToRgba(fillColor);
  if (rgbaEqual(target, fill)) return;
  const stack = [[x, y]];
  const visited = new Uint8Array(W * H);
  while (stack.length) {
    const [cx, cy] = stack.pop();
    if (cx < 0 || cx >= W || cy < 0 || cy >= H) continue;
    const vi = cy * W + cx;
    if (visited[vi]) continue;
    if (!rgbaEqual(getPixel(frames[currentFrame], cx, cy), target)) continue;
    visited[vi] = 1;
    setPixel(frames[currentFrame], cx, cy, fill);
    stack.push([cx+1,cy],[cx-1,cy],[cx,cy+1],[cx,cy-1]);
  }
}

function eyedrop(x, y) {
  const [r,g,b,a] = getPixel(frames[currentFrame], x, y);
  if (a === 0) { fgColor = 'transparent'; updateSwatches(); setTool('pen'); return; }
  const hex = '#' + [r,g,b].map(v => v.toString(16).padStart(2,'0')).join('');
  fgColor = hex;
  updateSwatches();
  setTool('pen');
  toast('EYEDROP → PEN');
}

// ── SELECTION / CLIPBOARD ─────────────────────────────────────────────────
function normalizeSelection(s) {
  if (!s) return null;
  let { x0, y0, x1, y1 } = s;
  if (x1 < x0) [x0, x1] = [x1, x0];
  if (y1 < y0) [y0, y1] = [y1, y0];
  x0 = Math.max(0, Math.min(W-1, x0));
  y0 = Math.max(0, Math.min(H-1, y0));
  x1 = Math.max(0, Math.min(W-1, x1));
  y1 = Math.max(0, Math.min(H-1, y1));
  return { x: x0, y: y0, w: x1 - x0 + 1, h: y1 - y0 + 1 };
}

function copySelection() {
  if (!selection) { toast('NO SELECTION'); return; }
  const { x, y, w, h } = selection;
  const buf = new Uint8ClampedArray(w * h * 4);
  for (let ry = 0; ry < h; ry++) {
    for (let rx = 0; rx < w; rx++) {
      const [r,g,b,a] = getPixel(frames[currentFrame], x+rx, y+ry);
      const di = (ry*w+rx)*4;
      buf[di]=r; buf[di+1]=g; buf[di+2]=b; buf[di+3]=a;
    }
  }
  clipboard = { data: buf, w, h };
  toast('COPIED ' + w + '×' + h);
}

function cutSelection() {
  if (!selection) { toast('NO SELECTION'); return; }
  copySelection();
  pushUndo();
  const { x, y, w, h } = selection;
  for (let ry = 0; ry < h; ry++) {
    for (let rx = 0; rx < w; rx++) {
      setPixel(frames[currentFrame], x+rx, y+ry, [0,0,0,0]);
    }
  }
  selection = null;
  renderAll(); renderFramesList();
  toast('CUT');
}

function startPaste() {
  if (!clipboard) { toast('CLIPBOARD EMPTY'); return; }
  pasteActive = true;
  pasteBuf = { data: new Uint8ClampedArray(clipboard.data), w: clipboard.w, h: clipboard.h };
  pasteOffset = { x: 0, y: 0 };
  selection = null;
  renderMain();
  toast('PASTE — drag/Enter to commit, Esc cancel');
}

function commitPaste() {
  if (!pasteActive || !pasteBuf) return;
  pushUndo();
  const { w, h, data } = pasteBuf;
  for (let ry = 0; ry < h; ry++) {
    for (let rx = 0; rx < w; rx++) {
      const si = (ry*w+rx)*4;
      setPixel(frames[currentFrame], pasteOffset.x+rx, pasteOffset.y+ry,
        [data[si], data[si+1], data[si+2], data[si+3]]);
    }
  }
  pasteActive = false;
  pasteBuf = null;
  renderAll(); renderFramesList();
  toast('PASTED');
}

function cancelPaste() {
  pasteActive = false;
  pasteBuf = null;
  renderMain();
  toast('PASTE CANCELLED');
}

document.getElementById('sel-copy-btn').onclick = copySelection;
document.getElementById('sel-cut-btn').onclick = cutSelection;
document.getElementById('sel-paste-btn').onclick = startPaste;
document.getElementById('sel-clear-btn').onclick = () => {
  selection = null;
  cancelPaste();
  renderSelection();
  toast('DESELECTED');
};

// mobile clipboard
document.getElementById('mob-copy').onclick = copySelection;
document.getElementById('mob-paste').onclick = startPaste;

// ── POINTER EVENTS (unified mouse + touch) ────────────────────────────────
let lastPointer = null;
let pinchDist = null;

function getPointerXY(e) {
  if (e.touches && e.touches.length > 0) {
    return { clientX: e.touches[0].clientX, clientY: e.touches[0].clientY };
  }
  return { clientX: e.clientX, clientY: e.clientY };
}

function onPointerDown(e) {
  e.preventDefault();
  // Pinch start
  if (e.touches && e.touches.length === 2) {
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    pinchDist = Math.hypot(dx, dy);
    return;
  }

  const { clientX, clientY } = getPointerXY(e);
  const [x, y] = getCanvasXY(clientX, clientY);
  const isRight = e.button === 2;

  // Ctrl+click = eyedrop
  if (!e.touches && (e.ctrlKey || e.metaKey)) {
    eyedrop(x, y); return;
  }

  if (tool === 'eyedrop') { eyedrop(x, y); return; }

  // Paste drag
  if (pasteActive) {
    lastPointer = { x, y, ox: pasteOffset.x, oy: pasteOffset.y };
    return;
  }

  if (tool === 'select') {
    selStart = { x, y };
    selDragging = true;
    selection = null;
    return;
  }

  if (tool === 'move') {
    if (selection && x >= selection.x && x < selection.x + selection.w &&
        y >= selection.y && y < selection.y + selection.h) {
      moveDragging = true;
      moveStart = { x, y, sx: selection.x, sy: selection.y };
      moveFrame = new Uint8ClampedArray(frames[currentFrame]);
    }
    return;
  }

  paintColor = isRight ? bgColor : fgColor;
  if (tool === 'eraser') paintColor = 'erase';

  pushUndo();

  if (tool === 'fill') {
    floodFill(x, y, paintColor);
    renderAll(); renderFramesList();
    return;
  }
  painting = true;
  paintAt(x, y, paintColor);
  renderAll();
}

function onPointerMove(e) {
  e.preventDefault();

  // Pinch zoom
  if (e.touches && e.touches.length === 2 && pinchDist !== null) {
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    const newDist = Math.hypot(dx, dy);
    if (newDist > pinchDist * 1.3) { zoomIn(); pinchDist = newDist; }
    else if (newDist < pinchDist * 0.77) { zoomOut(); pinchDist = newDist; }
    return;
  }

  const { clientX, clientY } = getPointerXY(e);
  const [x, y] = getCanvasXY(clientX, clientY);
  coordLabel.textContent = x + ', ' + y;

  if (pasteActive && lastPointer) {
    pasteOffset.x = Math.max(0, Math.min(W - pasteBuf.w, lastPointer.ox + (x - lastPointer.x)));
    pasteOffset.y = Math.max(0, Math.min(H - pasteBuf.h, lastPointer.oy + (y - lastPointer.y)));
    renderMain();
    return;
  }

  if (selDragging && selStart) {
    selection = normalizeSelection({ x0: selStart.x, y0: selStart.y, x1: x, y1: y });
    return;
  }

  if (moveDragging && moveStart && selection) {
    const dx = x - moveStart.x;
    const dy = y - moveStart.y;
    const nx = Math.max(0, Math.min(W - selection.w, moveStart.sx + dx));
    const ny = Math.max(0, Math.min(H - selection.h, moveStart.sy + dy));
    // restore original, then blit selection at new pos
    frames[currentFrame] = new Uint8ClampedArray(moveFrame);
    const selW = selection.w, selH = selection.h;
    const oldX = moveStart.sx, oldY = moveStart.sy;
    for (let ry = 0; ry < selH; ry++) {
      for (let rx = 0; rx < selW; rx++) {
        const px = getPixel(moveFrame, oldX+rx, oldY+ry);
        setPixel(frames[currentFrame], oldX+rx, oldY+ry, [0,0,0,0]);
        setPixel(frames[currentFrame], nx+rx, ny+ry, px);
      }
    }
    selection = { x: nx, y: ny, w: selW, h: selH };
    renderMain();
    return;
  }

  if (!painting) return;
  paintAt(x, y, paintColor);
  renderMain();
}

function onPointerUp(e) {
  if (pasteActive) { lastPointer = null; return; }
  if (selDragging) {
    selDragging = false;
    if (selection && selection.w > 0 && selection.h > 0) {
      toast('SEL ' + selection.w + '×' + selection.h);
    }
    return;
  }
  if (moveDragging) {
    moveDragging = false;
    moveFrame = null;
    pushUndo();
    renderFramesList();
    return;
  }
  if (painting) { painting = false; renderFramesList(); }
  pinchDist = null;
}

// Attach both mouse and touch events
mainCanvas.addEventListener('mousedown',  onPointerDown);
mainCanvas.addEventListener('mousemove',  onPointerMove);
mainCanvas.addEventListener('mouseup',    onPointerUp);
mainCanvas.addEventListener('mouseleave', onPointerUp);
mainCanvas.addEventListener('contextmenu', e => e.preventDefault());

mainCanvas.addEventListener('touchstart',  onPointerDown, { passive: false });
mainCanvas.addEventListener('touchmove',   onPointerMove, { passive: false });
mainCanvas.addEventListener('touchend',    onPointerUp,   { passive: false });
mainCanvas.addEventListener('touchcancel', onPointerUp,   { passive: false });

// Pinch reset on touchend
mainCanvas.addEventListener('touchend', () => { pinchDist = null; }, { passive: true });

// ── TOOL MANAGEMENT ───────────────────────────────────────────────────────
function setTool(t) {
  tool = t;
  document.querySelectorAll('.tool-btn,.mob-btn[data-tool]').forEach(b => {
    if (b.dataset.tool) b.classList.toggle('active', b.dataset.tool === t);
  });
  const names = { pen:'PEN', eraser:'ERASE', fill:'FILL', eyedrop:'DROP', select:'SEL', move:'MOVE' };
  toolIndicator.textContent = names[t] || t.toUpperCase();
  const cursors = { pen:'crosshair', eraser:'cell', fill:'crosshair', eyedrop:'copy', select:'default', move:'move' };
  mainCanvas.style.cursor = cursors[t] || 'crosshair';
}

document.querySelectorAll('.tool-btn').forEach(btn => {
  btn.onclick = () => setTool(btn.dataset.tool);
});
document.querySelectorAll('.mob-btn[data-tool]').forEach(btn => {
  btn.onclick = () => setTool(btn.dataset.tool);
});

// ── PALETTE ───────────────────────────────────────────────────────────────
function renderPalette() {
  paletteGrid.innerHTML = '';
  palette.forEach((c, i) => {
    const cell = document.createElement('div');
    cell.className = 'pal-cell';
    if (i === selectedFgIdx) cell.classList.add('selected-fg');
    if (i === selectedBgIdx) cell.classList.add('selected-bg');

    if (c === ERASER_COLOR) {
      cell.classList.add('eraser-cell');
      cell.title = 'Eraser (transparent)';
    } else {
      cell.style.background = c;
      cell.title = c;
    }

    cell.onclick = () => {
      fgColor = c === ERASER_COLOR ? 'transparent' : c;
      selectedFgIdx = i;
      updateSwatches();
      renderPalette();
      if (c === ERASER_COLOR) { setTool('eraser'); toast('ERASER'); }
    };
    cell.oncontextmenu = (e) => {
      e.preventDefault();
      bgColor = c === ERASER_COLOR ? 'transparent' : c;
      selectedBgIdx = i;
      updateSwatches();
      renderPalette();
    };

    // double-click to edit (always for FULL, palette cells that aren't eraser)
    if (c !== ERASER_COLOR) {
      cell.ondblclick = () => openColorPicker('palette', i);
    }

    paletteGrid.appendChild(cell);
  });
}

function updateSwatches() {
  if (fgColor === 'transparent' || fgColor === ERASER_COLOR) {
    fgSwatch.style.background = 'repeating-conic-gradient(#ccc 0% 25%, #fff 0% 50%) 0 0 / 8px 8px';
  } else {
    fgSwatch.style.background = fgColor;
  }
  if (bgColor === 'transparent' || bgColor === ERASER_COLOR) {
    bgSwatch.style.background = 'repeating-conic-gradient(#ccc 0% 25%, #fff 0% 50%) 0 0 / 8px 8px';
  } else {
    bgSwatch.style.background = bgColor;
  }
}

fgSwatch.onclick = () => {
  if (fgColor !== 'transparent') openColorPicker('fg');
};
bgSwatch.onclick = () => {
  if (bgColor !== 'transparent') openColorPicker('bg');
};

document.getElementById('swap-btn').onclick = () => {
  [fgColor, bgColor] = [bgColor, fgColor];
  [selectedFgIdx, selectedBgIdx] = [selectedBgIdx, selectedFgIdx];
  updateSwatches();
  renderPalette();
};

document.querySelectorAll('.pal-preset-btn').forEach(btn => {
  btn.onclick = () => {
    currentPaletteMode = btn.dataset.preset;
    document.querySelectorAll('.pal-preset-btn').forEach(b => b.classList.remove('active-preset'));
    btn.classList.add('active-preset');

    if (currentPaletteMode === 'digi') {
      palette = [...DIGI_PALETTE];
      fullEditHint.style.display = 'none';
    } else {
      palette = [...FULL_PALETTE];
      fullEditHint.style.display = 'block';
    }
    selectedFgIdx = 1;
    selectedBgIdx = Math.min(4, palette.length - 1);
    fgColor = palette[selectedFgIdx] === ERASER_COLOR ? 'transparent' : palette[selectedFgIdx];
    bgColor = palette[selectedBgIdx] === ERASER_COLOR ? 'transparent' : palette[selectedBgIdx];
    updateSwatches();
    renderPalette();
    toast(currentPaletteMode.toUpperCase() + ' PALETTE');
  };
});

// ── COLOR PICKER ─────────────────────────────────────────────────────────
let pickerPaletteIdx = -1;
function openColorPicker(target, palIdx) {
  editingColorFor = target;
  pickerPaletteIdx = palIdx !== undefined ? palIdx : -1;
  let col;
  if (target === 'fg') col = fgColor;
  else if (target === 'bg') col = bgColor;
  else col = palette[palIdx];

  if (!col || col === 'transparent') col = '#000000';
  nativePicker.value = col;
  hexInput.value = col;
  document.getElementById('picker-title').textContent =
    target === 'palette' ? 'PALETTE #' + palIdx : target.toUpperCase() + ' COLOR';

  // position near palette
  const rect = paletteGrid.getBoundingClientRect();
  colorPopup.style.left = (rect.right + 6) + 'px';
  colorPopup.style.top = (rect.top) + 'px';
  colorPopup.classList.add('show');
}

nativePicker.oninput = () => { hexInput.value = nativePicker.value; };
hexInput.oninput = () => {
  if (/^#[0-9a-f]{6}$/i.test(hexInput.value)) nativePicker.value = hexInput.value;
};

document.getElementById('picker-ok-btn').onclick = () => {
  const col = nativePicker.value;
  if (editingColorFor === 'fg') { fgColor = col; updateSwatches(); }
  else if (editingColorFor === 'bg') { bgColor = col; updateSwatches(); }
  else if (editingColorFor === 'palette' && pickerPaletteIdx >= 0) {
    palette[pickerPaletteIdx] = col;
    renderPalette();
  }
  colorPopup.classList.remove('show');
};
document.addEventListener('click', e => {
  if (!colorPopup.contains(e.target) && e.target !== fgSwatch && e.target !== bgSwatch
      && !e.target.classList.contains('pal-cell')) {
    colorPopup.classList.remove('show');
  }
});

// ── BRUSH ────────────────────────────────────────────────────────────────
const brushSlider = document.getElementById('brush-size');
const brushVal = document.getElementById('brush-size-val');
brushSlider.oninput = () => { brushSize = +brushSlider.value; brushVal.textContent = brushSize; };

// ── ZOOM ─────────────────────────────────────────────────────────────────
function zoomIn() {
  zoom = Math.min(zoom * 2, 32);
  applyZoom(); renderAll();
}
function zoomOut() {
  zoom = Math.max(Math.floor(zoom / 2), 1);
  applyZoom(); renderAll();
}
document.getElementById('zoom-in').onclick = zoomIn;
document.getElementById('zoom-out').onclick = zoomOut;
document.getElementById('mob-zoom-in').onclick = zoomIn;
document.getElementById('mob-zoom-out').onclick = zoomOut;

// Mouse wheel zoom on canvas
canvasWrapper.addEventListener('wheel', e => {
  e.preventDefault();
  if (e.deltaY < 0) zoomIn(); else zoomOut();
}, { passive: false });

// ── GRID ─────────────────────────────────────────────────────────────────
const gridToggle = document.getElementById('grid-toggle');
gridToggle.onclick = () => {
  showGrid = !showGrid;
  gridToggle.textContent = 'GRID: ' + (showGrid ? 'ON' : 'OFF');
  renderGrid();
};

// ── ONION SKIN ────────────────────────────────────────────────────────────
const onionToggle = document.getElementById('onion-toggle');
onionToggle.onclick = () => {
  onionSkin = !onionSkin;
  onionToggle.textContent = 'ONION: ' + (onionSkin ? 'ON' : 'OFF');
  onionToggle.classList.toggle('on', onionSkin);
  renderOnion();
};

// ── FLIP / CLEAR ─────────────────────────────────────────────────────────
document.getElementById('flip-h-btn').onclick = () => {
  pushUndo();
  const d = frames[currentFrame];
  const copy = new Uint8ClampedArray(d);
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      const src = (y * W + (W-1-x)) * 4;
      const dst = (y * W + x) * 4;
      d[dst]=copy[src]; d[dst+1]=copy[src+1]; d[dst+2]=copy[src+2]; d[dst+3]=copy[src+3];
    }
  }
  renderAll(); renderFramesList();
};

document.getElementById('flip-v-btn').onclick = () => {
  pushUndo();
  const d = frames[currentFrame];
  const copy = new Uint8ClampedArray(d);
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      const src = ((H-1-y) * W + x) * 4;
      const dst = (y * W + x) * 4;
      d[dst]=copy[src]; d[dst+1]=copy[src+1]; d[dst+2]=copy[src+2]; d[dst+3]=copy[src+3];
    }
  }
  renderAll(); renderFramesList();
};

document.getElementById('clear-btn').onclick = () => {
  pushUndo();
  frames[currentFrame].fill(0);
  selection = null;
  renderAll(); renderFramesList();
};

// ── FRAME BUTTONS ─────────────────────────────────────────────────────────
document.getElementById('add-frame-btn').onclick = addFrame;
document.getElementById('dup-frame-btn').onclick = dupFrame;

// ── ANIMATION ─────────────────────────────────────────────────────────────
const fpsInput = document.getElementById('fps-input');
fpsInput.oninput = () => {
  fps = Math.max(1, Math.min(24, +fpsInput.value));
  if (isPlaying) { stopAnim(); startAnim(); }
};

const playBtn = document.getElementById('play-btn');
playBtn.onclick = () => { isPlaying ? stopAnim() : startAnim(); };

let animFrame = 0;
function startAnim() {
  if (frames.length < 2) { toast('Need 2+ frames'); return; }
  isPlaying = true;
  playBtn.textContent = '■';
  playBtn.classList.add('playing');
  animFrame = 0;
  playInterval = setInterval(() => {
    renderPreview(animFrame);
    animFrame = (animFrame + 1) % frames.length;
  }, 1000 / fps);
}

function stopAnim() {
  isPlaying = false;
  playBtn.textContent = '▶';
  playBtn.classList.remove('playing');
  clearInterval(playInterval);
  renderPreview();
}

// ── RESIZE ────────────────────────────────────────────────────────────────
document.getElementById('resize-btn').onclick = () => {
  const nw = Math.max(1, Math.min(128, +document.getElementById('new-w').value));
  const nh = Math.max(1, Math.min(128, +document.getElementById('new-h').value));
  if (nw === W && nh === H) return;
  frames = frames.map(f => {
    const newF = new Uint8ClampedArray(nw * nh * 4);
    for (let y = 0; y < Math.min(H, nh); y++) {
      for (let x = 0; x < Math.min(W, nw); x++) {
        const si = (y * W + x) * 4;
        const di = (y * nw + x) * 4;
        newF[di]=f[si]; newF[di+1]=f[si+1]; newF[di+2]=f[si+2]; newF[di+3]=f[si+3];
      }
    }
    return newF;
  });
  W = nw; H = nh;
  undoStack = frames.map(() => []);
  redoStack = frames.map(() => []);
  selection = null;
  applyZoom(); renderAll(); renderFramesList();
  toast('RESIZED TO ' + W + '×' + H);
};

// ── EXPORT ────────────────────────────────────────────────────────────────
function getExportScale() { return +document.getElementById('export-scale').value; }

function exportFramePNG() {
  const scale = getExportScale();
  const c = document.createElement('canvas');
  c.width = W * scale; c.height = H * scale;
  const ec = c.getContext('2d');
  const img = new ImageData(new Uint8ClampedArray(frames[currentFrame]), W, H);
  const off = document.createElement('canvas'); off.width=W; off.height=H;
  off.getContext('2d').putImageData(img, 0, 0);
  ec.imageSmoothingEnabled = false;
  ec.drawImage(off, 0, 0, W*scale, H*scale);
  downloadCanvas(c, 'frame_' + (currentFrame+1) + '.png');
}

function exportSpritePNG() {
  const scale = getExportScale();
  const c = document.createElement('canvas');
  c.width = W * frames.length * scale; c.height = H * scale;
  const ec = c.getContext('2d');
  ec.imageSmoothingEnabled = false;
  frames.forEach((f, i) => {
    const img = new ImageData(new Uint8ClampedArray(f), W, H);
    const off = document.createElement('canvas'); off.width=W; off.height=H;
    off.getContext('2d').putImageData(img, 0, 0);
    ec.drawImage(off, i * W * scale, 0, W*scale, H*scale);
  });
  downloadCanvas(c, 'sprite_sheet.png');
}

function downloadCanvas(c, name) {
  const a = document.createElement('a');
  a.href = c.toDataURL('image/png');
  a.download = name;
  a.click();
  toast('EXPORTED: ' + name);
}

document.getElementById('export-frame-btn').onclick = exportFramePNG;
document.getElementById('export-anim-btn').onclick = exportSpritePNG;

// ── GIF EXPORT ────────────────────────────────────────────────────────────
document.getElementById('export-gif-btn').onclick = () => {
  if (!window.GifWriter) {
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/omggif@1.0.10/omggif.js';
    s.onload = () => exportGIF();
    s.onerror = () => { toast('GIF lib load failed'); };
    document.head.appendChild(s);
  } else {
    exportGIF();
  }
};

function exportGIF() {
  const scale = getExportScale();
  const gw = W * scale, gh = H * scale;
  const buf = new Uint8Array(gw * gh * frames.length * 4 + 1024);
  const gf = new GifWriter(buf, gw, gh, { loop: 0 });
  const delay = Math.round(100 / fps);
  frames.forEach(frame => {
    const pixels = new Uint8Array(gw * gh);
    const colorSet = {};
    const scaledRGBA = [];
    for (let y = 0; y < gh; y++) {
      for (let x = 0; x < gw; x++) {
        const sx = Math.floor(x / scale), sy = Math.floor(y / scale);
        const si = (sy * W + sx) * 4;
        const r = frame[si], g = frame[si+1], b = frame[si+2], a = frame[si+3];
        scaledRGBA.push(r, g, b, a);
        const key = a < 128 ? 'T' : (r + ',' + g + ',' + b);
        if (!colorSet[key]) colorSet[key] = Object.keys(colorSet).length;
      }
    }
    const colKeys = Object.keys(colorSet);
    while (colKeys.length < 2) colKeys.push('0,0,0');
    const palSize = Math.pow(2, Math.ceil(Math.log2(Math.max(2, colKeys.length))));
    const pal = new Array(palSize).fill(0).flatMap((_, i) => {
      if (i >= colKeys.length) return [0, 0, 0];
      if (colKeys[i] === 'T') return [0, 0, 0];
      return colKeys[i].split(',').map(Number);
    });
    for (let i = 0; i < gw * gh; i++) {
      const r = scaledRGBA[i*4], g = scaledRGBA[i*4+1], b = scaledRGBA[i*4+2], a = scaledRGBA[i*4+3];
      const key = a < 128 ? 'T' : (r + ',' + g + ',' + b);
      pixels[i] = colorSet[key] || 0;
    }
    const transpIdx = colorSet['T'] !== undefined ? colorSet['T'] : -1;
    gf.addFrame(0, 0, gw, gh, pixels, {
      palette: pal, delay, disposal: 2,
      transparent: transpIdx >= 0 ? transpIdx : undefined
    });
  });
  const used = buf.slice(0, gf.end());
  const blob = new Blob([used], { type: 'image/gif' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'animation.gif'; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  toast('GIF EXPORTED!');
}

// ── SAVE / LOAD ───────────────────────────────────────────────────────────
document.getElementById('save-btn').onclick = () => {
  const data = JSON.stringify({ W, H, palette, frames: frames.map(f => Array.from(f)) });
  const blob = new Blob([data], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'digipaint.json'; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  toast('SAVED!');
};

document.getElementById('load-btn').onclick = () => document.getElementById('load-file').click();
document.getElementById('load-file').onchange = (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const d = JSON.parse(ev.target.result);
      W = d.W; H = d.H;
      palette = d.palette;
      frames = d.frames.map(f => new Uint8ClampedArray(f));
      undoStack = frames.map(() => []);
      redoStack = frames.map(() => []);
      currentFrame = 0;
      selection = null;
      applyZoom(); renderAll(); renderFramesList(); renderPalette();
      document.getElementById('new-w').value = W;
      document.getElementById('new-h').value = H;
      toast('LOADED!');
    } catch { toast('LOAD ERROR'); }
  };
  reader.readAsText(file);
  e.target.value = '';
};

// LocalStorage autosave
function autosave() {
  try {
    localStorage.setItem('digipaint_autosave', JSON.stringify({ W, H, palette, frames: frames.map(f => Array.from(f)) }));
  } catch {}
}
setInterval(autosave, 10000);

(function() {
  try {
    const saved = localStorage.getItem('digipaint_autosave');
    if (saved) {
      const d = JSON.parse(saved);
      W = d.W; H = d.H;
      palette = d.palette;
      frames = d.frames.map(f => new Uint8ClampedArray(f));
      undoStack = frames.map(() => []);
      redoStack = frames.map(() => []);
      document.getElementById('new-w').value = W;
      document.getElementById('new-h').value = H;
    }
  } catch {}
})();

// ── MOBILE BUTTONS ────────────────────────────────────────────────────────
document.getElementById('mob-undo').onclick = undo;
document.getElementById('mob-redo').onclick = redo;

// ── KEYBOARD ─────────────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if ((e.ctrlKey || e.metaKey) && e.key === 'z') { e.preventDefault(); undo(); return; }
  if ((e.ctrlKey || e.metaKey) && e.key === 'y') { e.preventDefault(); redo(); return; }
  if ((e.ctrlKey || e.metaKey) && e.key === 'c') { e.preventDefault(); copySelection(); return; }
  if ((e.ctrlKey || e.metaKey) && e.key === 'x') { e.preventDefault(); cutSelection(); return; }
  if ((e.ctrlKey || e.metaKey) && e.key === 'v') { e.preventDefault(); startPaste(); return; }
  if (e.key === 'Enter' && pasteActive) { commitPaste(); return; }
  if (e.key === 'Escape') {
    if (pasteActive) { cancelPaste(); return; }
    selection = null;
    renderSelection();
    return;
  }
  // Arrow keys: move paste offset or selection
  if (pasteActive && pasteBuf) {
    const step = e.shiftKey ? 5 : 1;
    if (e.key === 'ArrowLeft')  { pasteOffset.x = Math.max(0, pasteOffset.x - step); renderMain(); e.preventDefault(); return; }
    if (e.key === 'ArrowRight') { pasteOffset.x = Math.min(W - pasteBuf.w, pasteOffset.x + step); renderMain(); e.preventDefault(); return; }
    if (e.key === 'ArrowUp')    { pasteOffset.y = Math.max(0, pasteOffset.y - step); renderMain(); e.preventDefault(); return; }
    if (e.key === 'ArrowDown')  { pasteOffset.y = Math.min(H - pasteBuf.h, pasteOffset.y + step); renderMain(); e.preventDefault(); return; }
  }
  if (e.key === 'p' || e.key === 'b') setTool('pen');
  if (e.key === 'e') setTool('eraser');
  if (e.key === 'f') setTool('fill');
  if (e.key === 'i') setTool('eyedrop');
  if (e.key === 's') setTool('select');
  if (e.key === 'm') setTool('move');
  if (e.key === 'g') gridToggle.click();
  if (e.key === '+' || e.key === '=') zoomIn();
  if (e.key === '-') zoomOut();
});

// ── TOAST ─────────────────────────────────────────────────────────────────
let toastTimer = null;
function toast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1600);
}

// ── START ─────────────────────────────────────────────────────────────────
initEditor();
