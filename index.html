<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>DOT-PAINT</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}

:root{
  --lcd-bg:#8bac0f;
  --lcd-dark:#0f380f;
  --lcd-mid:#4a7a10;
  --panel2:#f0ede0;
  --panel3:#e0ddd0;
  --panel4:#d0cdc0;
  --border:#9a9880;
  --border2:#6a6850;
  --text:#1a1a00;
  --text-dim:#4a4830;
  --canvas-bg:#b0ae9a;
  --btn-bg:#dedad0;
  --btn-text:#1a1a00;
  --btn-hover-bg:#4a7a10;
  --btn-hover-text:#ffffff;
  --active-bg:#3a6a00;
  --active-text:#ffffff;
}

body{
  background:var(--canvas-bg);
  color:var(--text);
  font-family:'Share Tech Mono',monospace;
  height:100dvh;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  user-select:none;
  touch-action:none;
}

/* HEADER */
#header{
  background:var(--panel2);
  border-bottom:2px solid var(--border2);
  padding:4px 10px;
  display:flex;
  align-items:center;
  gap:8px;
  flex-shrink:0;
}
#logo{font-family:'VT323',monospace;font-size:24px;color:var(--lcd-dark);letter-spacing:3px;}
#logo span{color:var(--lcd-mid);}
.hdr-info{font-size:10px;color:var(--text-dim);}
.size-ctrl{display:flex;align-items:center;gap:3px;}
.size-ctrl input{
  background:var(--panel3);border:1px solid var(--border);color:var(--text);
  font-family:'Share Tech Mono',monospace;font-size:11px;width:34px;text-align:center;padding:2px;
}
.size-ctrl input:focus{outline:1px solid var(--lcd-mid);}
.hdr-btn{
  background:var(--btn-bg);border:1px solid var(--border);color:var(--btn-text);
  font-family:'Share Tech Mono',monospace;font-size:10px;padding:3px 7px;cursor:pointer;
}
.hdr-btn:hover{background:var(--btn-hover-bg);color:var(--btn-hover-text);border-color:var(--btn-hover-bg);}
.spacer{flex:1;}

/* MAIN */
#main{display:flex;flex:1;overflow:hidden;min-height:0;}

/* LEFT PANEL */
#left-panel{
  width:116px;background:var(--panel2);border-right:2px solid var(--border);
  display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto;overflow-x:hidden;
}
.panel-section{border-bottom:1px solid var(--border);padding:6px 7px;}
.panel-label{font-size:8px;color:var(--text-dim);letter-spacing:2px;margin-bottom:5px;font-weight:bold;}

/* TOOLS */
#tool-grid{display:grid;grid-template-columns:1fr 1fr;gap:2px;}
.tool-btn{
  background:var(--btn-bg);border:1px solid var(--border);color:var(--btn-text);
  font-family:'VT323',monospace;font-size:17px;padding:4px 2px;cursor:pointer;
  text-align:center;display:flex;flex-direction:column;align-items:center;gap:1px;line-height:1;
}
.tool-btn .tname{font-family:'Share Tech Mono',monospace;font-size:7px;color:var(--text-dim);}
.tool-btn:hover{background:var(--btn-hover-bg);color:var(--btn-hover-text);border-color:var(--btn-hover-bg);}
.tool-btn:hover .tname{color:#cfc;}
.tool-btn.active{background:var(--active-bg);color:var(--active-text);border-color:var(--lcd-dark);}
.tool-btn.active .tname{color:#afa;}

/* shift sel indicator */
#shift-sel-indicator{
  margin-top:4px;font-size:8px;color:var(--text-dim);
  text-align:center;padding:2px 0;background:var(--panel3);border:1px solid var(--border);
}
#shift-sel-indicator.active{
  background:#b00;color:#fff;border-color:#800;font-weight:bold;
}

/* SWATCHES */
#fg-bg-display{position:relative;width:54px;height:40px;margin:0 auto 4px;}
.color-swatch{width:32px;height:28px;border:2px solid var(--border2);cursor:pointer;position:absolute;}
#bg-swatch{bottom:0;right:0;z-index:1;}
#fg-swatch{top:0;left:0;z-index:2;border-color:var(--lcd-dark);}
#swap-btn{
  position:absolute;top:0;right:0;background:var(--btn-bg);border:1px solid var(--border);
  color:var(--text-dim);font-size:11px;cursor:pointer;z-index:3;padding:0 2px;line-height:1.5;
}
#swap-btn:hover{color:var(--text);background:var(--panel3);}

/* PALETTE */
#palette-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;margin-bottom:5px;}
.pal-cell{width:100%;aspect-ratio:1;border:1px solid var(--border);cursor:pointer;position:relative;}
.pal-cell:hover{outline:2px solid var(--lcd-dark);outline-offset:0;}
.pal-cell.selected-fg::after{
  content:'F';position:absolute;top:0;left:1px;
  font-size:7px;color:#fff;line-height:1;
  text-shadow:0 0 3px #000,0 0 3px #000;
  font-family:'Share Tech Mono',monospace;font-weight:bold;
}
.pal-cell.selected-bg::after{
  content:'B';position:absolute;bottom:0;right:1px;
  font-size:7px;color:#000;line-height:1;
  text-shadow:0 0 3px #fff,0 0 3px #fff;
  font-family:'Share Tech Mono',monospace;font-weight:bold;
}
.pal-cell.eraser-cell{background:repeating-conic-gradient(#bbb 0% 25%,#fff 0% 50%) 0 0 / 8px 8px !important;}
.pal-preset-row{display:flex;gap:3px;margin-bottom:3px;}
.pal-preset-btn{
  flex:1;font-size:8px;padding:2px 0;
  background:var(--btn-bg);border:1px solid var(--border);color:var(--btn-text);
  cursor:pointer;font-family:'Share Tech Mono',monospace;
}
.pal-preset-btn:hover{background:var(--btn-hover-bg);color:var(--btn-hover-text);border-color:var(--btn-hover-bg);}
.pal-preset-btn.active-preset{background:var(--active-bg);color:var(--active-text);border-color:var(--lcd-dark);}
#full-edit-hint{font-size:8px;color:var(--text-dim);text-align:center;margin-top:2px;display:none;}

/* BRUSH */
.slider-row{display:flex;align-items:center;gap:4px;margin-bottom:3px;}
.slider-row label{font-size:9px;color:var(--text-dim);white-space:nowrap;}
.slider-row input[type=range]{flex:1;accent-color:var(--lcd-mid);height:2px;}
.slider-row span{font-size:9px;min-width:18px;text-align:right;color:var(--text);}

/* PANEL BUTTONS */
.panel-btn{
  width:100%;font-size:9px;padding:3px 0;
  background:var(--btn-bg);border:1px solid var(--border);color:var(--btn-text);
  cursor:pointer;font-family:'Share Tech Mono',monospace;margin-bottom:2px;display:block;
}
.panel-btn:hover{background:var(--btn-hover-bg);color:var(--btn-hover-text);border-color:var(--btn-hover-bg);}
.panel-btn-row{display:grid;grid-template-columns:1fr 1fr;gap:2px;margin-bottom:2px;}
.panel-btn-row .panel-btn{margin-bottom:0;}

/* CENTER */
#center{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:var(--canvas-bg);overflow:hidden;position:relative;min-width:0;
}
#canvas-wrapper{position:relative;cursor:crosshair;image-rendering:pixelated;}
#main-canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges;}
#grid-canvas,#onion-canvas,#select-canvas{
  position:absolute;top:0;left:0;pointer-events:none;image-rendering:pixelated;
}
#onion-canvas{opacity:0.3;}
#select-canvas{z-index:5;}

#zoom-bar{
  position:absolute;bottom:8px;left:50%;transform:translateX(-50%);
  display:flex;align-items:center;gap:6px;
  background:rgba(240,237,224,0.93);border:1px solid var(--border2);
  padding:3px 10px;border-radius:2px;
}
.zoom-btn{
  background:none;border:none;color:var(--text);
  font-size:18px;cursor:pointer;font-family:'VT323',monospace;padding:0 2px;line-height:1;
}
.zoom-btn:hover{color:var(--lcd-mid);}
#zoom-label{min-width:32px;text-align:center;font-size:10px;color:var(--text);}

#coord-label{
  position:absolute;top:6px;left:6px;font-size:10px;color:var(--text-dim);
  background:rgba(240,237,224,0.85);padding:2px 6px;pointer-events:none;
}
#tool-indicator{
  position:absolute;top:6px;right:6px;font-family:'VT323',monospace;font-size:18px;
  color:var(--text);background:rgba(240,237,224,0.85);padding:2px 7px;pointer-events:none;
}
.sel-info{
  position:absolute;bottom:34px;left:50%;transform:translateX(-50%);
  background:rgba(240,237,224,0.93);border:1px solid var(--border2);
  color:var(--text);font-size:9px;padding:2px 8px;
  pointer-events:none;display:none;white-space:nowrap;
}

/* RIGHT PANEL */
#right-panel{
  width:144px;background:var(--panel2);border-left:2px solid var(--border);
  display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto;
}
#preview-wrap{
  background:var(--panel3);border:1px solid var(--border2);width:100%;aspect-ratio:1;
  display:flex;align-items:center;justify-content:center;margin-bottom:5px;overflow:hidden;
}
#preview-canvas{image-rendering:pixelated;image-rendering:crisp-edges;}
.preview-controls{display:flex;gap:4px;align-items:center;}
.preview-controls label{font-size:9px;color:var(--text-dim);}
.preview-controls input[type=number]{
  width:30px;background:var(--panel3);border:1px solid var(--border);
  color:var(--text);font-family:'Share Tech Mono',monospace;font-size:10px;text-align:center;padding:1px;
}
#play-btn{
  background:var(--btn-bg);border:1px solid var(--border2);color:var(--btn-text);
  font-family:'VT323',monospace;font-size:16px;padding:1px 5px;cursor:pointer;margin-left:auto;
}
#play-btn:hover,#play-btn.playing{background:var(--active-bg);color:#fff;}
#onion-toggle{
  font-size:8px;color:var(--btn-text);background:var(--btn-bg);border:1px solid var(--border);
  cursor:pointer;padding:2px 4px;font-family:'Share Tech Mono',monospace;width:100%;
}
#onion-toggle.on{background:var(--active-bg);color:#fff;border-color:var(--lcd-dark);}
#frames-section{flex:1;overflow-y:auto;padding:6px 7px;border-bottom:1px solid var(--border);}
#frames-list{display:flex;flex-direction:column;gap:3px;}
.frame-item{
  display:flex;align-items:center;gap:3px;padding:2px;
  border:1px solid var(--border);cursor:pointer;background:var(--panel3);
}
.frame-item:hover{border-color:var(--border2);}
.frame-item.active{border-color:var(--lcd-dark);background:var(--panel4);}
.frame-thumb{width:32px;height:32px;image-rendering:pixelated;flex-shrink:0;border:1px solid var(--border);}
.frame-num{font-size:8px;color:var(--text-dim);flex:1;}
.frame-del{font-size:10px;color:var(--text-dim);cursor:pointer;background:none;border:none;padding:0 2px;}
.frame-del:hover{color:#c00;}
#frame-btns{display:flex;gap:3px;margin-top:5px;}
.frame-btn{
  flex:1;font-size:8px;padding:3px 0;
  background:var(--btn-bg);border:1px solid var(--border);color:var(--btn-text);
  cursor:pointer;font-family:'Share Tech Mono',monospace;
}
.frame-btn:hover{background:var(--btn-hover-bg);color:var(--btn-hover-text);border-color:var(--btn-hover-bg);}
#export-section{padding:6px 7px;border-bottom:1px solid var(--border);}
.exp-row{display:flex;gap:3px;margin-bottom:4px;align-items:center;}
.exp-label{font-size:9px;color:var(--text-dim);white-space:nowrap;}
.exp-select{
  flex:1;background:var(--panel3);border:1px solid var(--border);
  color:var(--text);font-family:'Share Tech Mono',monospace;font-size:9px;padding:1px;
}
.exp-btn{
  width:100%;font-size:9px;padding:3px;
  background:var(--btn-bg);border:1px solid var(--border2);color:var(--btn-text);
  cursor:pointer;font-family:'Share Tech Mono',monospace;margin-bottom:3px;
}
.exp-btn:hover{background:var(--btn-hover-bg);color:var(--btn-hover-text);border-color:var(--btn-hover-bg);}
#saveload-section{padding:6px 7px;}
.sl-btn{
  width:100%;font-size:8px;padding:3px;
  background:var(--btn-bg);border:1px solid var(--border);color:var(--btn-text);
  cursor:pointer;font-family:'Share Tech Mono',monospace;margin-bottom:3px;
}
.sl-btn:hover{background:var(--btn-hover-bg);color:var(--btn-hover-text);border-color:var(--btn-hover-bg);}

/* TOAST */
#toast{
  position:fixed;bottom:56px;left:50%;transform:translateX(-50%);
  background:var(--lcd-dark);border:1px solid var(--lcd-bg);color:var(--lcd-bg);
  font-family:'Share Tech Mono',monospace;font-size:11px;
  padding:5px 12px;pointer-events:none;opacity:0;transition:opacity 0.2s;z-index:999;white-space:nowrap;
}
#toast.show{opacity:1;}

/* COLOR PICKER POPUP */
#color-picker-popup{
  position:fixed;background:var(--panel2);border:2px solid var(--border2);
  padding:10px;z-index:300;display:none;flex-direction:column;gap:6px;
  box-shadow:0 4px 16px rgba(0,0,0,0.2);
}
#color-picker-popup.show{display:flex;}
#color-picker-popup input[type=color]{width:80px;height:30px;border:1px solid var(--border);cursor:pointer;}
#color-picker-popup input[type=text]{
  width:80px;background:var(--panel3);border:1px solid var(--border2);
  color:var(--text);font-family:'Share Tech Mono',monospace;font-size:11px;padding:2px 4px;
}
#picker-title{font-size:10px;color:var(--text-dim);}
#picker-ok-btn{
  font-size:10px;padding:4px;background:var(--active-bg);border:none;color:#fff;
  cursor:pointer;font-family:'Share Tech Mono',monospace;
}
#picker-ok-btn:hover{background:var(--lcd-dark);}

::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-track{background:var(--panel3);}
::-webkit-scrollbar-thumb{background:var(--border);}

/* MOBILE TOOLBAR - 2 fixed rows */
#mobile-toolbar{
  display:none;
  position:fixed;bottom:0;left:0;right:0;
  background:var(--panel2);border-top:2px solid var(--border2);
  flex-direction:column;z-index:100;
}
.mob-row{display:flex;border-bottom:1px solid var(--border);}
.mob-row:last-child{border-bottom:none;}
.mob-btn{
  flex:1;background:var(--btn-bg);border:none;border-right:1px solid var(--border);
  color:var(--btn-text);font-family:'VT323',monospace;font-size:20px;
  padding:5px 2px;cursor:pointer;line-height:1;text-align:center;min-width:0;
  display:flex;flex-direction:column;align-items:center;
}
.mob-btn:last-child{border-right:none;}
.mob-btn.active{background:var(--active-bg);color:#fff;}
.mob-btn:active{filter:brightness(0.85);}
.mob-label{font-family:'Share Tech Mono',monospace;font-size:6px;color:inherit;margin-top:1px;letter-spacing:0;}

/* responsive */
@media(max-width:640px){
  #right-panel{display:none;}
  #left-panel{width:90px;}
  #mobile-toolbar{display:flex;}
  body{padding-bottom:86px;}
  #zoom-bar{bottom:90px;}
  #toast{bottom:90px;}
  .sel-info{bottom:90px;}
  #header{padding:3px 6px;gap:5px;}
  #logo{font-size:20px;}
  .hdr-info{display:none;}
}
@media(max-width:400px){
  #left-panel{display:none;}
}
</style>
</head>
<body>

<div id="header">
  <div id="logo">DOT<span>-</span>PAINT</div>
  <div class="hdr-info">SIZE:<span id="canvas-size-label">32×32</span></div>
  <div class="size-ctrl">
    <input type="number" id="new-w" value="32" min="1" max="128">
    <span style="color:var(--text-dim);font-size:10px">×</span>
    <input type="number" id="new-h" value="32" min="1" max="128">
    <button class="hdr-btn" id="resize-btn">RESIZE</button>
  </div>
  <div class="spacer"></div>
  <div class="hdr-info" style="font-size:9px">Ctrl+Z/Y &nbsp;|&nbsp; Shift:SEL &nbsp;|&nbsp; Mid-click:DROP</div>
</div>

<div id="main">
  <div id="left-panel">
    <div class="panel-section">
      <div class="panel-label">// TOOLS</div>
      <div id="tool-grid">
        <button class="tool-btn active" data-tool="pen">✏<span class="tname">PEN</span></button>
        <button class="tool-btn" data-tool="eraser">⬜<span class="tname">ERASE</span></button>
        <button class="tool-btn" data-tool="fill">🪣<span class="tname">FILL</span></button>
        <button class="tool-btn" data-tool="move">✥<span class="tname">MOVE</span></button>
      </div>
      <div id="shift-sel-indicator">Shift: SELECT</div>
    </div>

    <div class="panel-section">
      <div class="panel-label">// COLOR</div>
      <div id="fg-bg-display">
        <div class="color-swatch" id="bg-swatch" title="BG (right-click)"></div>
        <div class="color-swatch" id="fg-swatch" title="FG (left-click)"></div>
        <button id="swap-btn" title="Swap">⇄</button>
      </div>
      <div style="font-size:8px;color:var(--text-dim);text-align:center;">L:FG &nbsp;R:BG<br>Mid:EYEDROP</div>
    </div>

    <div class="panel-section">
      <div class="panel-label">// PALETTE</div>
      <div id="palette-grid"></div>
      <div class="pal-preset-row">
        <button class="pal-preset-btn active-preset" data-preset="digi">DIGI</button>
        <button class="pal-preset-btn" data-preset="full">FULL</button>
      </div>
      <div id="full-edit-hint">▲ dbl-click=edit</div>
    </div>

    <div class="panel-section">
      <div class="panel-label">// CLIPBOARD</div>
      <div class="panel-btn-row">
        <button class="panel-btn" id="sel-copy-btn">COPY</button>
        <button class="panel-btn" id="sel-cut-btn">CUT</button>
      </div>
      <button class="panel-btn" id="sel-paste-btn">PASTE</button>
      <button class="panel-btn" id="sel-clear-btn">DESEL</button>
    </div>

    <div class="panel-section">
      <div class="panel-label">// BRUSH</div>
      <div class="slider-row">
        <label>SZ</label>
        <input type="range" id="brush-size" min="1" max="8" value="1">
        <span id="brush-size-val">1</span>
      </div>
    </div>

    <div class="panel-section">
      <div class="panel-label">// EDIT</div>
      <button class="panel-btn" id="flip-h-btn">FLIP H</button>
      <button class="panel-btn" id="flip-v-btn">FLIP V</button>
      <button class="panel-btn" id="clear-btn">CLEAR</button>
      <button class="panel-btn" id="grid-toggle" style="margin-top:2px">GRID: ON</button>
    </div>
  </div>

  <div id="center">
    <div id="canvas-wrapper">
      <canvas id="onion-canvas"></canvas>
      <canvas id="main-canvas"></canvas>
      <canvas id="grid-canvas"></canvas>
      <canvas id="select-canvas"></canvas>
    </div>
    <div id="coord-label">0, 0</div>
    <div id="tool-indicator">PEN</div>
    <div id="selection-info" class="sel-info"></div>
    <div id="zoom-bar">
      <button class="zoom-btn" id="zoom-out">－</button>
      <span id="zoom-label">8×</span>
      <button class="zoom-btn" id="zoom-in">＋</button>
    </div>
  </div>

  <div id="right-panel">
    <div class="panel-section">
      <div class="panel-label">// PREVIEW</div>
      <div id="preview-wrap"><canvas id="preview-canvas"></canvas></div>
      <div class="preview-controls">
        <label>FPS</label>
        <input type="number" id="fps-input" value="4" min="1" max="24">
        <button id="play-btn">▶</button>
      </div>
      <div style="margin-top:4px;"><button id="onion-toggle">ONION: OFF</button></div>
    </div>

    <div id="frames-section">
      <div class="panel-label">// FRAMES</div>
      <div id="frames-list"></div>
      <div id="frame-btns">
        <button class="frame-btn" id="add-frame-btn">+NEW</button>
        <button class="frame-btn" id="dup-frame-btn">DUP</button>
      </div>
    </div>

    <div id="export-section">
      <div class="panel-label">// EXPORT</div>
      <div class="exp-row">
        <span class="exp-label">SCALE</span>
        <select class="exp-select" id="export-scale">
          <option value="1">1×</option><option value="2">2×</option>
          <option value="4">4×</option><option value="8">8×</option>
        </select>
      </div>
      <button class="exp-btn" id="export-frame-btn">PNG: FRAME</button>
      <button class="exp-btn" id="export-anim-btn">PNG: SPRITE</button>
      <button class="exp-btn" id="export-gif-btn">ANIM GIF</button>
    </div>

    <div id="saveload-section">
      <div class="panel-label">// FILE</div>
      <button class="sl-btn" id="save-btn">SAVE .JSON</button>
      <button class="sl-btn" id="load-btn">LOAD .JSON</button>
      <input type="file" id="load-file" accept=".json" style="display:none">
    </div>
  </div>
</div>

<!-- MOBILE TOOLBAR: 2 rows -->
<div id="mobile-toolbar">
  <div class="mob-row">
    <button class="mob-btn active" data-tool="pen">✏<span class="mob-label">PEN</span></button>
    <button class="mob-btn" data-tool="eraser">⬜<span class="mob-label">ERASE</span></button>
    <button class="mob-btn" data-tool="fill">🪣<span class="mob-label">FILL</span></button>
    <button class="mob-btn" data-tool="move">✥<span class="mob-label">MOVE</span></button>
    <button class="mob-btn" id="mob-shift-sel">⬚<span class="mob-label">SEL</span></button>
    <button class="mob-btn" id="mob-undo">↩<span class="mob-label">UNDO</span></button>
    <button class="mob-btn" id="mob-redo">↪<span class="mob-label">REDO</span></button>
  </div>
  <div class="mob-row">
    <button class="mob-btn" id="mob-copy">⎘<span class="mob-label">COPY</span></button>
    <button class="mob-btn" id="mob-cut">✂<span class="mob-label">CUT</span></button>
    <button class="mob-btn" id="mob-paste">📋<span class="mob-label">PASTE</span></button>
    <button class="mob-btn" id="mob-desel">✕<span class="mob-label">DESEL</span></button>
    <button class="mob-btn" id="mob-zoom-out">－<span class="mob-label">ZOOM</span></button>
    <button class="mob-btn" id="mob-zoom-in">＋<span class="mob-label">ZOOM</span></button>
    <button class="mob-btn" id="mob-grid">▦<span class="mob-label">GRID</span></button>
  </div>
</div>

<div id="color-picker-popup">
  <div id="picker-title">FG COLOR</div>
  <input type="color" id="native-picker">
  <input type="text" id="hex-input" placeholder="#8bac0f" maxlength="7">
  <button id="picker-ok-btn">OK</button>
</div>
<div id="toast"></div>

<script>
// STATE
let W=32, H=32, zoom=8;
let tool='pen';
let fgColor='#0f380f', bgColor='#8bac0f';
let brushSize=1, showGrid=true, onionSkin=false;
let isPlaying=false, playInterval=null, fps=4, currentFrame=0;
let editingColorFor='fg', currentPaletteMode='digi';
let frames=[], undoStack=[], redoStack=[];
const MAX_UNDO=32;

// Selection
let selection=null;
let selDragging=false, selStart=null;
let shiftHeld=false, mobileShiftSel=false;
let clipboard=null;
let pasteActive=false, pasteOffset={x:0,y:0}, pasteBuf=null, pasteDragStart=null;
let moveDragging=false, moveStart=null, moveFrame=null;

const ERASER='transparent';
let palette=[];

const DIGI_PAL=[ERASER,'#0f380f','#306230','#8bac0f','#9bbc0f','#ffffff','#000000','#2a2a2a','#555555','#7a7a7a','#9a9a9a','#bbbbbb','#dddddd','#c0d04f','#1a3a00','#4a8a10'];
const FULL_PAL=[ERASER,'#ff0000','#ff4400','#ff8800','#ffcc00','#ffff00','#aaff00','#00ff00','#00ff88','#00ffff','#0088ff','#0000ff','#8800ff','#ff00ff','#ffffff','#000000'];

let selectedFgIdx=1, selectedBgIdx=4;

// DOM
const mainCanvas=document.getElementById('main-canvas');
const gridCanvas=document.getElementById('grid-canvas');
const onionCanvas=document.getElementById('onion-canvas');
const selectCanvas=document.getElementById('select-canvas');
const previewCanvas=document.getElementById('preview-canvas');
const canvasWrapper=document.getElementById('canvas-wrapper');
const coordLabel=document.getElementById('coord-label');
const toolIndicator=document.getElementById('tool-indicator');
const zoomLabel=document.getElementById('zoom-label');
const fgSwatch=document.getElementById('fg-swatch');
const bgSwatch=document.getElementById('bg-swatch');
const paletteGrid=document.getElementById('palette-grid');
const framesList=document.getElementById('frames-list');
const toastEl=document.getElementById('toast');
const colorPopup=document.getElementById('color-picker-popup');
const nativePicker=document.getElementById('native-picker');
const hexInput=document.getElementById('hex-input');
const selInfo=document.getElementById('selection-info');
const fullEditHint=document.getElementById('full-edit-hint');
const shiftIndic=document.getElementById('shift-sel-indicator');

const ctx=mainCanvas.getContext('2d');
const gCtx=gridCanvas.getContext('2d');
const oCtx=onionCanvas.getContext('2d');
const sCtx=selectCanvas.getContext('2d');
const pCtx=previewCanvas.getContext('2d');

// INIT
function initEditor(){
  palette=[...DIGI_PAL];
  frames=[newFrame()]; undoStack=[[]]; redoStack=[[]];
  applyZoom(); renderAll(); renderFramesList(); renderPalette();
  fgColor=palette[selectedFgIdx]===ERASER?'transparent':palette[selectedFgIdx];
  bgColor=palette[selectedBgIdx]===ERASER?'transparent':palette[selectedBgIdx];
  updateSwatches();
}
function newFrame(){return new Uint8ClampedArray(W*H*4);}
function applyZoom(){
  const pw=W*zoom,ph=H*zoom;
  [mainCanvas,gridCanvas,onionCanvas,selectCanvas].forEach(c=>{c.width=pw;c.height=ph;});
  canvasWrapper.style.width=pw+'px'; canvasWrapper.style.height=ph+'px';
  zoomLabel.textContent=zoom+'×';
  const ps=Math.min(Math.floor(128/Math.max(W,H)),8);
  previewCanvas.width=W*ps; previewCanvas.height=H*ps;
  previewCanvas.style.width=W*ps+'px'; previewCanvas.style.height=H*ps+'px';
  document.getElementById('canvas-size-label').textContent=W+'×'+H;
}

// RENDER
function renderAll(){renderMain();renderGrid();renderOnion();renderPreview();renderSelection();}

function drawChecker(c,w,h){
  const sz=8;
  for(let y=0;y<h;y+=sz) for(let x=0;x<w;x+=sz){
    c.fillStyle=((x/sz+y/sz)%2===0)?'#b0ad9a':'#c4c1ae';
    c.fillRect(x,y,sz,sz);
  }
}

function renderMain(){
  const img=new ImageData(new Uint8ClampedArray(frames[currentFrame]),W,H);
  const off=document.createElement('canvas'); off.width=W; off.height=H;
  off.getContext('2d').putImageData(img,0,0);
  ctx.clearRect(0,0,W*zoom,H*zoom);
  drawChecker(ctx,W*zoom,H*zoom);
  ctx.imageSmoothingEnabled=false;
  ctx.drawImage(off,0,0,W*zoom,H*zoom);
  if(pasteActive&&pasteBuf){
    const off2=document.createElement('canvas');
    off2.width=pasteBuf.w; off2.height=pasteBuf.h;
    off2.getContext('2d').putImageData(new ImageData(new Uint8ClampedArray(pasteBuf.data),pasteBuf.w,pasteBuf.h),0,0);
    ctx.globalAlpha=0.85; ctx.imageSmoothingEnabled=false;
    ctx.drawImage(off2,pasteOffset.x*zoom,pasteOffset.y*zoom,pasteBuf.w*zoom,pasteBuf.h*zoom);
    ctx.globalAlpha=1;
  }
}

function renderGrid(){
  gCtx.clearRect(0,0,W*zoom,H*zoom);
  if(!showGrid||zoom<4)return;
  gCtx.strokeStyle='rgba(60,80,10,0.2)'; gCtx.lineWidth=0.5;
  for(let x=0;x<=W;x++){gCtx.beginPath();gCtx.moveTo(x*zoom,0);gCtx.lineTo(x*zoom,H*zoom);gCtx.stroke();}
  for(let y=0;y<=H;y++){gCtx.beginPath();gCtx.moveTo(0,y*zoom);gCtx.lineTo(W*zoom,y*zoom);gCtx.stroke();}
}

function renderOnion(){
  oCtx.clearRect(0,0,W*zoom,H*zoom);
  if(!onionSkin||currentFrame===0)return;
  const img=new ImageData(new Uint8ClampedArray(frames[currentFrame-1]),W,H);
  const off=document.createElement('canvas'); off.width=W; off.height=H;
  off.getContext('2d').putImageData(img,0,0);
  oCtx.imageSmoothingEnabled=false; oCtx.drawImage(off,0,0,W*zoom,H*zoom);
}

function renderPreview(fi){
  fi=fi!==undefined?fi:currentFrame;
  const img=new ImageData(new Uint8ClampedArray(frames[fi]),W,H);
  const off=document.createElement('canvas'); off.width=W; off.height=H;
  off.getContext('2d').putImageData(img,0,0);
  pCtx.clearRect(0,0,previewCanvas.width,previewCanvas.height);
  drawChecker(pCtx,previewCanvas.width,previewCanvas.height);
  pCtx.imageSmoothingEnabled=false;
  pCtx.drawImage(off,0,0,previewCanvas.width,previewCanvas.height);
}

function renderSelection(){
  sCtx.clearRect(0,0,W*zoom,H*zoom);
  const sel=pasteActive&&pasteBuf?{x:pasteOffset.x,y:pasteOffset.y,w:pasteBuf.w,h:pasteBuf.h}:selection;
  if(!sel){selInfo.style.display='none';return;}
  const sx=sel.x*zoom,sy=sel.y*zoom,sw=sel.w*zoom,sh=sel.h*zoom;
  sCtx.fillStyle='rgba(58,106,0,0.1)'; sCtx.fillRect(sx,sy,sw,sh);
  sCtx.save();
  sCtx.strokeStyle='#2a5a00'; sCtx.lineWidth=1.5;
  sCtx.setLineDash([4,3]); sCtx.lineDashOffset=-(Date.now()/150);
  sCtx.strokeRect(sx+0.5,sy+0.5,sw-1,sh-1);
  sCtx.restore();
  selInfo.textContent=pasteActive
    ?'PASTE '+pasteBuf.w+'×'+pasteBuf.h+' @ ['+pasteOffset.x+','+pasteOffset.y+']  Enter:OK  Esc:cancel'
    :'SEL '+sel.w+'×'+sel.h+' @ ['+sel.x+','+sel.y+']';
  selInfo.style.display='block';
}
(function loop(){if(selection||(pasteActive&&pasteBuf))renderSelection();requestAnimationFrame(loop);})();

// FRAMES
function renderFramesList(){
  framesList.innerHTML='';
  frames.forEach((f,i)=>{
    const item=document.createElement('div');
    item.className='frame-item'+(i===currentFrame?' active':'');
    const thumb=document.createElement('canvas');
    thumb.className='frame-thumb'; thumb.width=W; thumb.height=H;
    thumb.getContext('2d').putImageData(new ImageData(new Uint8ClampedArray(f),W,H),0,0);
    const num=document.createElement('div'); num.className='frame-num'; num.textContent='#'+(i+1);
    const del=document.createElement('button'); del.className='frame-del'; del.textContent='×';
    del.onclick=e=>{e.stopPropagation();deleteFrame(i);};
    item.append(thumb,num,del);
    item.onclick=()=>switchFrame(i);
    framesList.appendChild(item);
  });
}
function switchFrame(i){currentFrame=i;selection=null;pasteActive=false;renderAll();renderFramesList();}
function addFrame(){frames.push(newFrame());undoStack.push([]);redoStack.push([]);switchFrame(frames.length-1);}
function dupFrame(){
  const c=new Uint8ClampedArray(frames[currentFrame]);
  frames.splice(currentFrame+1,0,c);undoStack.splice(currentFrame+1,0,[]);redoStack.splice(currentFrame+1,0,[]);
  switchFrame(currentFrame+1);
}
function deleteFrame(i){
  if(frames.length===1){toast('Cannot delete last frame');return;}
  frames.splice(i,1);undoStack.splice(i,1);redoStack.splice(i,1);
  if(currentFrame>=frames.length)currentFrame=frames.length-1;
  switchFrame(currentFrame);
}

// DRAWING
function hexToRgba(h){
  if(!h||h==='transparent'||h===ERASER)return[0,0,0,0];
  return[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16),255];
}
function setPixel(fd,x,y,rgba){
  if(x<0||x>=W||y<0||y>=H)return;
  const i=(y*W+x)*4;fd[i]=rgba[0];fd[i+1]=rgba[1];fd[i+2]=rgba[2];fd[i+3]=rgba[3];
}
function getPixel(fd,x,y){
  if(x<0||x>=W||y<0||y>=H)return[0,0,0,0];
  const i=(y*W+x)*4;return[fd[i],fd[i+1],fd[i+2],fd[i+3]];
}
function rgbaEq(a,b){return a[0]===b[0]&&a[1]===b[1]&&a[2]===b[2]&&a[3]===b[3];}

let painting=false, paintColor=null;

function pushUndo(){
  undoStack[currentFrame].push(new Uint8ClampedArray(frames[currentFrame]));
  if(undoStack[currentFrame].length>MAX_UNDO)undoStack[currentFrame].shift();
  redoStack[currentFrame]=[];
}
function undo(){
  if(!undoStack[currentFrame].length)return;
  redoStack[currentFrame].push(new Uint8ClampedArray(frames[currentFrame]));
  frames[currentFrame]=undoStack[currentFrame].pop();
  renderAll();renderFramesList();toast('UNDO');
}
function redo(){
  if(!redoStack[currentFrame].length)return;
  undoStack[currentFrame].push(new Uint8ClampedArray(frames[currentFrame]));
  frames[currentFrame]=redoStack[currentFrame].pop();
  renderAll();renderFramesList();toast('REDO');
}

function getXY(cx,cy){
  const r=mainCanvas.getBoundingClientRect();
  return[Math.floor((cx-r.left)/zoom),Math.floor((cy-r.top)/zoom)];
}

function paintAt(x,y,color){
  const rgba=(!color||color==='transparent'||color===ERASER)?[0,0,0,0]:hexToRgba(color);
  const half=Math.floor(brushSize/2);
  for(let dy=-half;dy<brushSize-half;dy++) for(let dx=-half;dx<brushSize-half;dx++)
    setPixel(frames[currentFrame],x+dx,y+dy,rgba);
}

function floodFill(x,y,fc){
  if(x<0||x>=W||y<0||y>=H)return;
  const target=getPixel(frames[currentFrame],x,y);
  const fill=(!fc||fc==='transparent')?[0,0,0,0]:hexToRgba(fc);
  if(rgbaEq(target,fill))return;
  const stack=[[x,y]],visited=new Uint8Array(W*H);
  while(stack.length){
    const[cx,cy]=stack.pop();
    if(cx<0||cx>=W||cy<0||cy>=H)continue;
    const vi=cy*W+cx;
    if(visited[vi]||!rgbaEq(getPixel(frames[currentFrame],cx,cy),target))continue;
    visited[vi]=1;setPixel(frames[currentFrame],cx,cy,fill);
    stack.push([cx+1,cy],[cx-1,cy],[cx,cy+1],[cx,cy-1]);
  }
}

function eyedrop(x,y){
  const[r,g,b,a]=getPixel(frames[currentFrame],x,y);
  fgColor=a===0?'transparent':'#'+[r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('');
  updateSwatches();toast('EYEDROP');
}

// SELECTION
function normSel(x0,y0,x1,y1){
  if(x1<x0)[x0,x1]=[x1,x0];if(y1<y0)[y0,y1]=[y1,y0];
  x0=Math.max(0,Math.min(W-1,x0));y0=Math.max(0,Math.min(H-1,y0));
  x1=Math.max(0,Math.min(W-1,x1));y1=Math.max(0,Math.min(H-1,y1));
  return{x:x0,y:y0,w:x1-x0+1,h:y1-y0+1};
}
function copySelection(){
  if(!selection){toast('NO SELECTION');return;}
  const{x,y,w,h}=selection;
  const buf=new Uint8ClampedArray(w*h*4);
  for(let ry=0;ry<h;ry++)for(let rx=0;rx<w;rx++){
    const[r,g,b,a]=getPixel(frames[currentFrame],x+rx,y+ry);
    const d=(ry*w+rx)*4;buf[d]=r;buf[d+1]=g;buf[d+2]=b;buf[d+3]=a;
  }
  clipboard={data:buf,w,h};toast('COPIED '+w+'×'+h);
}
function cutSelection(){
  if(!selection){toast('NO SELECTION');return;}
  copySelection();pushUndo();
  const{x,y,w,h}=selection;
  for(let ry=0;ry<h;ry++)for(let rx=0;rx<w;rx++)setPixel(frames[currentFrame],x+rx,y+ry,[0,0,0,0]);
  selection=null;renderAll();renderFramesList();toast('CUT');
}
function startPaste(){
  if(!clipboard){toast('CLIPBOARD EMPTY');return;}
  pasteActive=true;
  pasteBuf={data:new Uint8ClampedArray(clipboard.data),w:clipboard.w,h:clipboard.h};
  pasteOffset={x:0,y:0};selection=null;
  renderMain();toast('PASTE — drag to move, Enter:OK, Esc:cancel');
}
function commitPaste(){
  if(!pasteActive||!pasteBuf)return;
  pushUndo();
  const{w,h,data}=pasteBuf;
  for(let ry=0;ry<h;ry++)for(let rx=0;rx<w;rx++){
    const s=(ry*w+rx)*4;
    setPixel(frames[currentFrame],pasteOffset.x+rx,pasteOffset.y+ry,[data[s],data[s+1],data[s+2],data[s+3]]);
  }
  pasteActive=false;pasteBuf=null;renderAll();renderFramesList();toast('PASTED');
}
function cancelPaste(){pasteActive=false;pasteBuf=null;renderMain();selInfo.style.display='none';toast('CANCELLED');}
function clearSelection(){
  selection=null;selDragging=false;selStart=null;
  renderSelection();toast('DESELECTED');
}

document.getElementById('sel-copy-btn').onclick=copySelection;
document.getElementById('sel-cut-btn').onclick=cutSelection;
document.getElementById('sel-paste-btn').onclick=startPaste;
document.getElementById('sel-clear-btn').onclick=clearSelection;

// SHIFT KEY — toggle on press, deselect on second press
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT')return;
  if(e.key==='Shift'&&!e.repeat){

  // 貼り付け中なら確定
  if(pasteActive){
    commitPaste();
    return;
  }

  if(shiftHeld){
    shiftHeld=false;
    if(selDragging){selDragging=false;}
    selection=null;
    renderSelection();
  } else {
    shiftHeld=true;
  }

  updateShiftUI();
  return;
}
  // all other shortcuts below
  if((e.ctrlKey||e.metaKey)&&e.key==='z'){e.preventDefault();undo();return;}
  if((e.ctrlKey||e.metaKey)&&e.key==='y'){e.preventDefault();redo();return;}
  if((e.ctrlKey||e.metaKey)&&e.key==='c'){e.preventDefault();copySelection();return;}
  if((e.ctrlKey||e.metaKey)&&e.key==='x'){e.preventDefault();cutSelection();return;}
  if((e.ctrlKey||e.metaKey)&&e.key==='v'){e.preventDefault();startPaste();return;}
  if(e.key==='Escape'){
    if(pasteActive){cancelPaste();return;}
    if(shiftHeld){shiftHeld=false;updateShiftUI();}
    clearSelection();return;
  }
  if(pasteActive&&pasteBuf){
    const step=1;
    if(e.key==='ArrowLeft'){pasteOffset.x=Math.max(0,pasteOffset.x-step);renderMain();e.preventDefault();return;}
    if(e.key==='ArrowRight'){pasteOffset.x=Math.min(W-pasteBuf.w,pasteOffset.x+step);renderMain();e.preventDefault();return;}
    if(e.key==='ArrowUp'){pasteOffset.y=Math.max(0,pasteOffset.y-step);renderMain();e.preventDefault();return;}
    if(e.key==='ArrowDown'){pasteOffset.y=Math.min(H-pasteBuf.h,pasteOffset.y+step);renderMain();e.preventDefault();return;}
  }
  if(e.key==='p'||e.key==='b')setTool('pen');
  if(e.key==='e')setTool('eraser');
  if(e.key==='f')setTool('fill');
  if(e.key==='m')setTool('move');
  if(e.key==='g')document.getElementById('grid-toggle').click();
  if(e.key==='+'||e.key==='=')zoomIn();
  if(e.key==='-')zoomOut();
});

function updateShiftUI(){
  const on=shiftHeld||mobileShiftSel;
  shiftIndic.textContent=on?'■ SELECTING':'Shift: SELECT';
  shiftIndic.classList.toggle('active',on);
}

// POINTER EVENTS
let pinchDist=null;

function ptrClient(e){
  if(e.touches&&e.touches.length>0)return{clientX:e.touches[0].clientX,clientY:e.touches[0].clientY};
  return{clientX:e.clientX,clientY:e.clientY};
}

function onDown(e){
  e.preventDefault();
  if(e.touches&&e.touches.length===2){
    const dx=e.touches[0].clientX-e.touches[1].clientX;
    const dy=e.touches[0].clientY-e.touches[1].clientY;
    pinchDist=Math.hypot(dx,dy);return;
  }
  const{clientX,clientY}=ptrClient(e);
  const[x,y]=getXY(clientX,clientY);
  const isRight=e.button===2;
  const isMid=e.button===1;

  if(isMid){eyedrop(x,y);return;}

  if(pasteActive){
    pasteDragStart={x,y,ox:pasteOffset.x,oy:pasteOffset.y};return;
  }

  if(shiftHeld||mobileShiftSel){
    selStart={x,y};selDragging=true;selection=null;return;
  }

  if(!e.touches&&(e.ctrlKey||e.metaKey)){eyedrop(x,y);return;}

  if(tool==='move'){
    if(selection&&x>=selection.x&&x<selection.x+selection.w&&y>=selection.y&&y<selection.y+selection.h){
      moveDragging=true;
      moveStart={x,y,sx:selection.x,sy:selection.y};
      moveFrame=new Uint8ClampedArray(frames[currentFrame]);
    }
    return;
  }

  paintColor=isRight?bgColor:fgColor;
  if(tool==='eraser')paintColor='erase';
  pushUndo();
  if(tool==='fill'){floodFill(x,y,paintColor);renderAll();renderFramesList();return;}
  painting=true;paintAt(x,y,paintColor);renderAll();
}

function onMove(e){
  e.preventDefault();
  if(e.touches&&e.touches.length===2&&pinchDist!==null){
    const dx=e.touches[0].clientX-e.touches[1].clientX;
    const dy=e.touches[0].clientY-e.touches[1].clientY;
    const nd=Math.hypot(dx,dy);
    if(nd>pinchDist*1.3){zoomIn();pinchDist=nd;}
    else if(nd<pinchDist*0.75){zoomOut();pinchDist=nd;}
    return;
  }
  const{clientX,clientY}=ptrClient(e);
  const[x,y]=getXY(clientX,clientY);
  coordLabel.textContent=x+', '+y;

  if(pasteActive&&pasteDragStart){
    pasteOffset.x=Math.max(0,Math.min(W-pasteBuf.w,pasteDragStart.ox+(x-pasteDragStart.x)));
    pasteOffset.y=Math.max(0,Math.min(H-pasteBuf.h,pasteDragStart.oy+(y-pasteDragStart.y)));
    renderMain();return;
  }
  if(selDragging&&selStart){
    selection=normSel(selStart.x,selStart.y,x,y);return;
  }
  if(moveDragging&&moveStart&&selection){
    const dx=x-moveStart.x,dy=y-moveStart.y;
    const nx=Math.max(0,Math.min(W-selection.w,moveStart.sx+dx));
    const ny=Math.max(0,Math.min(H-selection.h,moveStart.sy+dy));
    frames[currentFrame]=new Uint8ClampedArray(moveFrame);
    const{w:sw,h:sh}=selection,ox=moveStart.sx,oy=moveStart.sy;
    for(let ry=0;ry<sh;ry++)for(let rx=0;rx<sw;rx++){
      const px=getPixel(moveFrame,ox+rx,oy+ry);
      setPixel(frames[currentFrame],ox+rx,oy+ry,[0,0,0,0]);
      setPixel(frames[currentFrame],nx+rx,ny+ry,px);
    }
    selection={x:nx,y:ny,w:sw,h:sh};renderMain();return;
  }
  if(!painting)return;
  paintAt(x,y,paintColor);renderMain();
}

function onUp(){
  pasteDragStart=null;
  if(selDragging){
    selDragging=false;
    if(selection)toast('SEL '+selection.w+'×'+selection.h);
    return;
  }
  if(moveDragging){moveDragging=false;moveFrame=null;pushUndo();renderFramesList();return;}
  if(painting){painting=false;renderFramesList();}
  pinchDist=null;
}

mainCanvas.addEventListener('mousedown',onDown);
mainCanvas.addEventListener('mousemove',onMove);
mainCanvas.addEventListener('mouseup',onUp);
mainCanvas.addEventListener('mouseleave',onUp);
mainCanvas.addEventListener('contextmenu',e=>e.preventDefault());
mainCanvas.addEventListener('mousedown',e=>{if(e.button===1)e.preventDefault();});
mainCanvas.addEventListener('touchstart',onDown,{passive:false});
mainCanvas.addEventListener('touchmove',onMove,{passive:false});
mainCanvas.addEventListener('touchend',onUp,{passive:false});
mainCanvas.addEventListener('touchcancel',onUp,{passive:false});

// Scroll wheel = zoom
canvasWrapper.addEventListener('wheel',e=>{
  e.preventDefault();
  if(e.deltaY<0)zoomIn();else zoomOut();
},{passive:false});

// TOOL
function setTool(t){
  tool=t;
  document.querySelectorAll('.tool-btn,.mob-btn[data-tool]').forEach(b=>{
    if(b.dataset.tool)b.classList.toggle('active',b.dataset.tool===t);
  });
  const names={pen:'PEN',eraser:'ERASE',fill:'FILL',move:'MOVE'};
  toolIndicator.textContent=names[t]||t.toUpperCase();
  const cursors={pen:'crosshair',eraser:'cell',fill:'crosshair',move:'move'};
  mainCanvas.style.cursor=cursors[t]||'crosshair';
}
document.querySelectorAll('.tool-btn').forEach(b=>{b.onclick=()=>setTool(b.dataset.tool);});
document.querySelectorAll('.mob-btn[data-tool]').forEach(b=>{b.onclick=()=>setTool(b.dataset.tool);});

// PALETTE
function renderPalette(){
  paletteGrid.innerHTML='';
  palette.forEach((c,i)=>{
    const cell=document.createElement('div');
    cell.className='pal-cell';
    if(i===selectedFgIdx)cell.classList.add('selected-fg');
    if(i===selectedBgIdx)cell.classList.add('selected-bg');
    if(c===ERASER){cell.classList.add('eraser-cell');cell.title='Eraser (transparent)';}
    else{cell.style.background=c;cell.title=c;}
    cell.onclick=()=>{
      fgColor=c===ERASER?'transparent':c;
      selectedFgIdx=i;updateSwatches();renderPalette();
      if(c===ERASER){setTool('eraser');toast('ERASER');}
    };
    cell.oncontextmenu=e=>{
      e.preventDefault();
      bgColor=c===ERASER?'transparent':c;
      selectedBgIdx=i;updateSwatches();renderPalette();
    };
    if(c!==ERASER)cell.ondblclick=()=>openColorPicker('palette',i);
    paletteGrid.appendChild(cell);
  });
}
function updateSwatches(){
  const ck='repeating-conic-gradient(#bbb 0% 25%,#fff 0% 50%) 0 0 / 8px 8px';
  fgSwatch.style.background=(!fgColor||fgColor==='transparent')?ck:fgColor;
  bgSwatch.style.background=(!bgColor||bgColor==='transparent')?ck:bgColor;
}
fgSwatch.onclick=()=>{if(fgColor&&fgColor!=='transparent')openColorPicker('fg');};
bgSwatch.onclick=()=>{if(bgColor&&bgColor!=='transparent')openColorPicker('bg');};
document.getElementById('swap-btn').onclick=()=>{
  [fgColor,bgColor]=[bgColor,fgColor];
  [selectedFgIdx,selectedBgIdx]=[selectedBgIdx,selectedFgIdx];
  updateSwatches();renderPalette();
};
document.querySelectorAll('.pal-preset-btn').forEach(btn=>{
  btn.onclick=()=>{
    currentPaletteMode=btn.dataset.preset;
    document.querySelectorAll('.pal-preset-btn').forEach(b=>b.classList.remove('active-preset'));
    btn.classList.add('active-preset');
    palette=currentPaletteMode==='digi'?[...DIGI_PAL]:[...FULL_PAL];
    fullEditHint.style.display=currentPaletteMode==='full'?'block':'none';
    selectedFgIdx=1;selectedBgIdx=4;
    fgColor=palette[1]===ERASER?'transparent':palette[1];
    bgColor=palette[4]===ERASER?'transparent':palette[4];
    updateSwatches();renderPalette();toast(currentPaletteMode.toUpperCase()+' PALETTE');
  };
});

// COLOR PICKER
let pickerPalIdx=-1;
function openColorPicker(target,palIdx){
  editingColorFor=target;
  pickerPalIdx=palIdx!==undefined?palIdx:-1;
  let col=target==='fg'?fgColor:target==='bg'?bgColor:palette[palIdx];
  if(!col||col==='transparent')col='#000000';
  nativePicker.value=col;hexInput.value=col;
  document.getElementById('picker-title').textContent=
    target==='palette'?'PALETTE #'+palIdx:target.toUpperCase()+' COLOR';
  const r=paletteGrid.getBoundingClientRect();
  let left=r.right+8,top=r.top;
  if(left+120>window.innerWidth)left=r.left-120;
  if(top+140>window.innerHeight)top=window.innerHeight-150;
  colorPopup.style.left=Math.max(4,left)+'px';
  colorPopup.style.top=Math.max(4,top)+'px';
  colorPopup.classList.add('show');
}
nativePicker.oninput=()=>{hexInput.value=nativePicker.value;};
hexInput.oninput=()=>{if(/^#[0-9a-f]{6}$/i.test(hexInput.value))nativePicker.value=hexInput.value;};
document.getElementById('picker-ok-btn').onclick=()=>{
  const col=nativePicker.value;
  if(editingColorFor==='fg'){fgColor=col;updateSwatches();}
  else if(editingColorFor==='bg'){bgColor=col;updateSwatches();}
  else if(editingColorFor==='palette'&&pickerPalIdx>=0){palette[pickerPalIdx]=col;renderPalette();}
  colorPopup.classList.remove('show');
};
document.addEventListener('click',e=>{
  if(!colorPopup.contains(e.target)&&e.target!==fgSwatch&&e.target!==bgSwatch&&!e.target.classList.contains('pal-cell'))
    colorPopup.classList.remove('show');
});

// BRUSH
document.getElementById('brush-size').oninput=function(){brushSize=+this.value;document.getElementById('brush-size-val').textContent=brushSize;};

// ZOOM
function zoomIn(){zoom=Math.min(zoom*2,32);applyZoom();renderAll();}
function zoomOut(){zoom=Math.max(Math.floor(zoom/2),1);applyZoom();renderAll();}
document.getElementById('zoom-in').onclick=zoomIn;
document.getElementById('zoom-out').onclick=zoomOut;

// GRID
const gridToggle=document.getElementById('grid-toggle');
gridToggle.onclick=()=>{showGrid=!showGrid;gridToggle.textContent='GRID: '+(showGrid?'ON':'OFF');renderGrid();};

// ONION
const onionToggle=document.getElementById('onion-toggle');
onionToggle.onclick=()=>{onionSkin=!onionSkin;onionToggle.textContent='ONION: '+(onionSkin?'ON':'OFF');onionToggle.classList.toggle('on',onionSkin);renderOnion();};

// FLIP/CLEAR
document.getElementById('flip-h-btn').onclick=()=>{
  pushUndo();const d=frames[currentFrame],c=new Uint8ClampedArray(d);
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){const s=(y*W+(W-1-x))*4,t=(y*W+x)*4;d[t]=c[s];d[t+1]=c[s+1];d[t+2]=c[s+2];d[t+3]=c[s+3];}
  renderAll();renderFramesList();
};
document.getElementById('flip-v-btn').onclick=()=>{
  pushUndo();const d=frames[currentFrame],c=new Uint8ClampedArray(d);
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){const s=((H-1-y)*W+x)*4,t=(y*W+x)*4;d[t]=c[s];d[t+1]=c[s+1];d[t+2]=c[s+2];d[t+3]=c[s+3];}
  renderAll();renderFramesList();
};
document.getElementById('clear-btn').onclick=()=>{pushUndo();frames[currentFrame].fill(0);selection=null;renderAll();renderFramesList();};

// FRAMES
document.getElementById('add-frame-btn').onclick=addFrame;
document.getElementById('dup-frame-btn').onclick=dupFrame;

// ANIMATION
const fpsInput=document.getElementById('fps-input');
fpsInput.oninput=()=>{fps=Math.max(1,Math.min(24,+fpsInput.value));if(isPlaying){stopAnim();startAnim();}};
const playBtn=document.getElementById('play-btn');
playBtn.onclick=()=>{isPlaying?stopAnim():startAnim();};
let animFrame=0;
function startAnim(){
  if(frames.length<2){toast('Need 2+ frames');return;}
  isPlaying=true;playBtn.textContent='■';playBtn.classList.add('playing');animFrame=0;
  playInterval=setInterval(()=>{renderPreview(animFrame);animFrame=(animFrame+1)%frames.length;},1000/fps);
}
function stopAnim(){
  isPlaying=false;playBtn.textContent='▶';playBtn.classList.remove('playing');
  clearInterval(playInterval);renderPreview();
}

// RESIZE
document.getElementById('resize-btn').onclick=()=>{
  const nw=Math.max(1,Math.min(128,+document.getElementById('new-w').value));
  const nh=Math.max(1,Math.min(128,+document.getElementById('new-h').value));
  if(nw===W&&nh===H)return;
  frames=frames.map(f=>{
    const nf=new Uint8ClampedArray(nw*nh*4);
    for(let y=0;y<Math.min(H,nh);y++)for(let x=0;x<Math.min(W,nw);x++){
      const si=(y*W+x)*4,di=(y*nw+x)*4;
      nf[di]=f[si];nf[di+1]=f[si+1];nf[di+2]=f[si+2];nf[di+3]=f[si+3];
    }
    return nf;
  });
  W=nw;H=nh;undoStack=frames.map(()=>[]);redoStack=frames.map(()=>[]);
  selection=null;applyZoom();renderAll();renderFramesList();toast('RESIZED TO '+W+'×'+H);
};

// EXPORT
function getExportScale(){return+document.getElementById('export-scale').value;}
function exportFramePNG(){
  const s=getExportScale(),c=document.createElement('canvas');
  c.width=W*s;c.height=H*s;
  const ec=c.getContext('2d');
  const off=document.createElement('canvas');off.width=W;off.height=H;
  off.getContext('2d').putImageData(new ImageData(new Uint8ClampedArray(frames[currentFrame]),W,H),0,0);
  ec.imageSmoothingEnabled=false;ec.drawImage(off,0,0,W*s,H*s);
  dlCanvas(c,'frame_'+(currentFrame+1)+'.png');
}
function exportSpritePNG(){
  const s=getExportScale(),c=document.createElement('canvas');
  c.width=W*frames.length*s;c.height=H*s;
  const ec=c.getContext('2d');ec.imageSmoothingEnabled=false;
  frames.forEach((f,i)=>{
    const off=document.createElement('canvas');off.width=W;off.height=H;
    off.getContext('2d').putImageData(new ImageData(new Uint8ClampedArray(f),W,H),0,0);
    ec.drawImage(off,i*W*s,0,W*s,H*s);
  });
  dlCanvas(c,'sprite_sheet.png');
}
function dlCanvas(c,name){const a=document.createElement('a');a.href=c.toDataURL('image/png');a.download=name;a.click();toast('EXPORTED: '+name);}
document.getElementById('export-frame-btn').onclick=exportFramePNG;
document.getElementById('export-anim-btn').onclick=exportSpritePNG;
document.getElementById('export-gif-btn').onclick=()=>{
  if(!window.GifWriter){const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/omggif@1.0.10/omggif.js';s.onload=()=>exportGIF();s.onerror=()=>toast('GIF lib failed');document.head.appendChild(s);}
  else exportGIF();
};
function exportGIF(){
  const scale=getExportScale(),gw=W*scale,gh=H*scale;
  const buf=new Uint8Array(gw*gh*frames.length*4+1024);
  const gf=new GifWriter(buf,gw,gh,{loop:0});
  const delay=Math.round(100/fps);
  frames.forEach(frame=>{
    const pixels=new Uint8Array(gw*gh),colorSet={},scaledRGBA=[];
    for(let y=0;y<gh;y++)for(let x=0;x<gw;x++){
      const sx=Math.floor(x/scale),sy=Math.floor(y/scale),si=(sy*W+sx)*4;
      const r=frame[si],g=frame[si+1],b=frame[si+2],a=frame[si+3];
      scaledRGBA.push(r,g,b,a);
      const key=a<128?'T':(r+','+g+','+b);
      if(!colorSet[key])colorSet[key]=Object.keys(colorSet).length;
    }
    const colKeys=Object.keys(colorSet);
    while(colKeys.length<2)colKeys.push('0,0,0');
    const palSize=Math.pow(2,Math.ceil(Math.log2(Math.max(2,colKeys.length))));
    const pal=new Array(palSize).fill(0).flatMap((_,i)=>{
      if(i>=colKeys.length)return[0,0,0];if(colKeys[i]==='T')return[0,0,0];
      return colKeys[i].split(',').map(Number);
    });
    for(let i=0;i<gw*gh;i++){
      const r=scaledRGBA[i*4],g=scaledRGBA[i*4+1],b=scaledRGBA[i*4+2],a=scaledRGBA[i*4+3];
      pixels[i]=colorSet[a<128?'T':(r+','+g+','+b)]||0;
    }
    const ti=colorSet['T']!==undefined?colorSet['T']:-1;
    gf.addFrame(0,0,gw,gh,pixels,{palette:pal,delay,disposal:2,transparent:ti>=0?ti:undefined});
  });
  const blob=new Blob([buf.slice(0,gf.end())],{type:'image/gif'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download='animation.gif';a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);toast('GIF EXPORTED!');
}

// SAVE/LOAD
document.getElementById('save-btn').onclick=()=>{
  const data=JSON.stringify({W,H,palette,frames:frames.map(f=>Array.from(f))});
  const blob=new Blob([data],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download='dotpaint.json';a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);toast('SAVED!');
};
document.getElementById('load-btn').onclick=()=>document.getElementById('load-file').click();
document.getElementById('load-file').onchange=e=>{
  const file=e.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=ev=>{
    try{
      const d=JSON.parse(ev.target.result);
      W=d.W;H=d.H;palette=d.palette;
      frames=d.frames.map(f=>new Uint8ClampedArray(f));
      undoStack=frames.map(()=>[]);redoStack=frames.map(()=>[]);
      currentFrame=0;selection=null;
      applyZoom();renderAll();renderFramesList();renderPalette();
      document.getElementById('new-w').value=W;
      document.getElementById('new-h').value=H;
      toast('LOADED!');
    }catch{toast('LOAD ERROR');}
  };
  reader.readAsText(file);e.target.value='';
};

// AUTOSAVE
function autosave(){
  try{localStorage.setItem('dotpaint',JSON.stringify({W,H,palette,frames:frames.map(f=>Array.from(f))}));}catch{}
}
setInterval(autosave,10000);
(function(){
  try{
    const saved=localStorage.getItem('dotpaint');
    if(saved){
      const d=JSON.parse(saved);
      W=d.W;H=d.H;palette=d.palette;
      frames=d.frames.map(f=>new Uint8ClampedArray(f));
      undoStack=frames.map(()=>[]);redoStack=frames.map(()=>[]);
      document.getElementById('new-w').value=W;
      document.getElementById('new-h').value=H;
    }
  }catch{}
})();

document.getElementById('mob-undo').onclick=undo;
document.getElementById('mob-redo').onclick=redo;
document.getElementById('mob-copy').onclick=copySelection;
document.getElementById('mob-cut').onclick=cutSelection;
document.getElementById('mob-paste').onclick=startPaste;
document.getElementById('mob-desel').onclick=clearSelection;

const mobShiftBtn=document.getElementById('mob-shift-sel');
mobShiftBtn.onclick=()=>{
  if(mobileShiftSel){
    mobileShiftSel=false;
    if(selDragging)selDragging=false;
    selection=null;renderSelection();
    mobShiftBtn.classList.remove('active');
  } else {
    mobileShiftSel=true;
    mobShiftBtn.classList.add('active');
  }
  updateShiftUI();
  toast(mobileShiftSel?'SELECT MODE ON':'SELECT MODE OFF');
};

initEditor();
